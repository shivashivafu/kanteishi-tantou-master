b\u306b\u304a\u3044\u3066\u3001\u305d\u306e\u5b85\u5730\u306e\u5168\u90e8\u53c8\u306f\u4e00\u90e8\u306b\u3064\u3044\u3066\u63db\u5730\u3092\u5b9a\u3081\u306a\u3044\u3053\u3068\u304c\n\u3067\u304d\u308b\u3002\n\u30ed \u571f\u5730\u533a\u753b\u6574\u7406\u7d44\u5408\u304c\u65bd\u884c\u3059\u308b\u571f\u5730\u533a\u753b\u6574\u7406\u4e8b\u696d\u306b\u304a\u3044\u3066\u306f\u3001\u5229\u5bb3\u95a2\u4fc2\u8005\u3067\u3042\u3063\u3066\n\u3082\u3001\u7d44\u5408\u54e1\u3067\u306a\u3044\u5834\u5408\u306b\u306f\u3001\u63db\u5730\u8a08\u753b\u306b\u3064\u3044\u3066\u65bd\u884c\u8005\u306b\u610f\u898b\u66f8\u3092\u63d0\u51fa\u3059\u308b\u3053\u3068\u304c\u3067\n\u304d\u306a\u3044\u3002\n\u30cf \u533a\u753b\u6574\u7406\u4f1a\u793e\u306f\u3001\u305d\u306e\u65bd\u884c\u3059\u308b\u571f\u5730\u533a\u753b\u6574\u7406\u4e8b\u696d\u306b\u304a\u3044\u3066\u3001\u707d\u5bb3\u3092\u9632\u6b62\u3057\u3001\u53ca\u3073\n\u885b\u751f\u306e\u5411\u4e0a\u3092\u56f3\u308b\u305f\u3081\u5b85\u5730\u306e\u5730\u7a4d\u306e\u898f\u6a21\u3092\u9069\u6b63\u306b\u3059\u308b\u7279\u5225\u306a\u5fc5\u8981\u304c\u3042\u308b\u3068\u8a8d\u3081\u3089\u308c\n\u308b\u5834\u5408\u306b\u304a\u3044\u3066\u306f\u3001\u5730\u7a4d\u304c\u8457\u3057\u304f\u5c0f\u3067\u3042\u308b\u305f\u3081\u5730\u7a4d\u3092\u5897\u3057\u3066\u63db\u5730\u3092\u5b9a\u3081\u308b\u3053\u3068\u304c\u9069\n\u5f53\u3067\u306a\u3044\u3068\u8a8d\u3081\u3089\u308c\u308b\u5b85\u5730\u306b\u3064\u3044\u3066\u306f\u3001\u571f\u5730\u533a\u753b\u6574\u7406\u5be9\u8b70\u4f1a\u306e\u540c\u610f\u3092\u5f97\u3066\u3001\u63db\u5730\u8a08\n\u753b\u306b\u304a\u3044\u3066\u63db\u5730\u3092\u5b9a\u3081\u306a\u3044\u3053\u3068\u304c\u3067\u304d\u308b\u3002\n\u30cb \u5e02\u753a\u6751\u306f\u3001\u305d\u306e\u65bd\u884c\u3059\u308b\u571f\u5730\u533a\u753b\u6574\u7406\u4e8b\u696d\u306e\u63db\u5730\u8a08\u753b\u306b\u304a\u3044\u3066\u6e05\u7b97\u91d1\u82e5\u3057\u304f\u306f\u4fdd\n\u7559\u5730\u3092\u5b9a\u3081\u3088\u3046\u3068\u3059\u308b\u5834\u5408\u53c8 wer":3},{"questionNumber":24,"question":"\u5b85\u5730\u9020\u6210\u53ca\u3073\u7279\u5b9a\u76db\u571f\u7b49\u898f\u5236\u6cd5(\u4ee5\u4e0b\u3053\u306e\u554f\u306b\u304a\u3044\u3066\u300c\u6cd5\u300d\u3068\u3044\u3046\u3002)\n\u306b\u95a2\u3059\u308b\u6b21\u306e\u8a18\u8ff0\u306e\u3046\u3061\u3001\u8aa4\u3063\u3066\u3044\u308b\u3082\u306e\u306f\u3069\u308c\u304b\u3002\u305f\u3060\u3057\u3001\u4ee5\u4e0b\u306e\u8a18\u8ff0\u306e\u3046\u3061\u3001\n\u300c\u90fd\u9053\u5e9c\u770c\u77e5\u4e8b\u300d\u306f\u6307\u5b9a\u90fd\u5e02\u53c8\u306f\u4e2d\u6838\u5e02\u306e\u9577\u3092\u542b\u3080\u3082\u306e\u3068\u3059\u308b\u3002","choices":["\u300c\u7279\u5b9a\u76db\u571f\u7b49\u300d\u3068\u306f\u3001\u5b85\u5730\u53c8\u306f\u8fb2\u5730\u7b49\u306b\u304a\u3044\u3066\u884c\u3046\u76db\u571f\u305d\u306e\u4ed6\u306e\u571f\u5730\u306e\u5f62\u8cea\u306e\u5909\n\u66f4\u3067\u3001\u5f53\u8a72\u5b85\u5730\u53c8\u306f\u8fb2\u5730\u7b49\u306b\u96a3\u63a5\u3057\u3001\u53c8\u306f\u8fd1\u63a5\u3059\u308b\u5b85\u5730\u306b\u304a\u3044\u3066\u707d\u5bb3\u3092\u767a\u751f\u3055\u305b\u308b\n\u304a\u305d\u308c\u304c\u5927\u304d\u3044\u3082\u306e\u3068\u3057\u3066\u653f\u4ee4\u3067\u5b9a\u3081\u308b\u3082\u306e\u3092\u3044\u3046\u3002","\u90fd\u9053\u5e9c\u770c\u77e5\u4e8b\u306f\u3001\u57fa\u790e\u8abf\u67fb\u306e\u305f\u3081\u306b\u4ed6\u4eba\u306e\u5360\u6709\u3059\u308b\u571f\u5730\u306b\u7acb\u3061\u5165\u3063\u3066\u6e2c\u91cf\u53c8\u306f\u8abf\n\u67fb\u3092\u884c\u3046\u5fc5\u8981\u304c\u3042\u308b\u3068\u304d\u306f\u3001\u305d\u306e\u5fc5\u8981\u306e\u9650\u5ea6\u306b\u304a\u3044\u3066\u3001\u4ed6\u4eba\u306e\u5360\u6709\u3059\u308b\u571f\u5730\u306b\u3001\u81ea\n\u3089\u7acb\u3061\u5165\u308a\u3001\u53c8\u306f\u305d\u306e\u547d\u3058\u305f\u8005\u82e5\u3057\u304f\u306f\u59d4\u4efb\u3057\u305f\u8005\u306b\u7acb\u3061\u5165\u3089\u305b\u308b\u3053\u3068\u304c\u3067\u304d\u308b\u3002","\u5b85\u5730\u9020\u6210\u53c8\u306f\u7279\u5b9a\u76db\u571f\u7b49\u306b\u95a2\u3059\u308b\u5de5\u4e8b\u306 u3092\u3059\u3079\n\u3066\u63b2\u3052\u305f\u7d44\u5408\u305b\u306f\u3069\u308c\u304b\u3002\n\u30a4 \u5bfe\u8c61\u78ba\u5b9a\u6761\u4ef6\u306f\u3001\u9451\u5b9a\u8a55\u4fa1\u306e\u5bfe\u8c61\u3068\u3059\u308b\u4e0d\u52d5\u7523\u306e\u6240\u5728\u3001\u7bc4\u56f2\u7b49\u306e\u7269\u7684\u4e8b\u9805\u53ca\u3073\u6240\u6709\u6a29\u3001\n\u8cc3\u501f\u6a29\u7b49\u306e\u5bfe\u8c61\u4e0d\u52d5\u7523\u306e\u6a29\u5229\u306e\u614b\u69d8\u306b\u95a2\u3059\u308b\u4e8b\u9805\u3092\u78ba\u5b9a\u3059\u308b\u305f\u3081\u306b\u5fc5\u8981\u306a\u6761\u4ef6\u3067\u3042\u308b\u3002\n\u30ed \u72ec\u7acb\u9451\u5b9a\u8a55\u4fa1\u3068\u306f\u3001\u4e0d\u52d5\u7523\u304c\u571f\u5730\u53ca\u3073\u5efa\u7269\u7b49\u306e\u7d50\u5408\u306b\u3088\u308a\u69cb\u6210\u3055\u308c\u3066\u3044\u308b\u5834\u5408\u306b\u304a\u3044\n\u3066\u3001\u305d\u306e\u571f\u5730\u306e\u307f\u3092\u5efa\u7269\u7b49\u304c\u5b58\u3057\u306a\u3044\u72ec\u7acb\u306e\u3082\u306e(\u66f4\u5730)\u3068\u3057\u3066\u9451\u5b9a\u8a55\u4fa1\u306e\u5bfe\u8c61\u3068\u3059\u308b\n\u3053\u3068\u3092\u3044\u3046\u3002\n\u30cf \u5efa\u7269\u306b\u4fc2\u308b\u672a\u7ae3\u5de5\u5efa\u7269\u7b49\u9451\u5b9a\u8a55\u4fa1\u3068\u306f\u3001\u5efa\u7bc9\u306b\u4fc2\u308b\u5de5\u4e8b(\u5efa\u7269\u3092\u65b0\u7bc9\u3059\u308b\u3082\u306e\u3067\u3042\u308a\u3001\n\u5897\u6539\u7bc9\u7b49\u306f\u542b\u307e\u306a\u3044\u3002)\u304c\u5b8c\u4e86\u3057\u3066\u3044\u306a\u3044\u5efa\u7269\u306b\u3064\u3044\u3066\u3001\u5f53\u8a72\u5de5\u4e8b\u306e\u5b8c\u4e86\u3092\u524d\u63d0\u3068\u3057\u3066\n\u9451\u5b9a\u8a55\u4fa1\u306e\u5bfe\u8c61\u3068\u3059\u308b\u3053\u3068\u3092\u3044\u3046\u3002\n\u30cb \u672a\u7ae3\u5de5\u5efa\u7269\u7b49\u9451\u5b9a\u8a55\u4fa1\u3092\u884c\u3046\u5834\u5408\u306f\u3001\u4fa1\u683c\u6642\u70b9\u306b\u304a\u3044\u3066\u60f3\u5b9a\u3055\u308c\u308b\u7ae3\u5de5\u5f8c\u306e\u4e0d\u52d5\u7523\u306b\n\u4fc2\u308b\u7269\u7684\u78ba\u8a8d\u3092\u884c\u3046\u305f\u3081\u306b\u5fc5\u8981\u306a\u8a2d\u8a08\u56f3\u66f8\u7b49\u5 b9a\u8a55\u4fa1\u66f8\u306e\n\u5229\u7528\u8005\u306e\u5229\u76ca\u3092\u5bb3\u3059\u308b\u304a\u305d\u308c\u304c\u306a\u3044\u304b\u3069\u3046\u304b\u306e\u89b3\u70b9\u304b\u3089\u59a5\u5f53\u6027\u304c\u8a8d\u3081\u3089\u308c\u305f\u305f\u3081\u3001\u53d6\u5f97\n\u5f8c\u306e\u72b6\u614b\u3092\u524d\u63d0\u3068\u3057\u305f\u5bfe\u8c61\u78ba\u5b9a\u6761\u4ef6\u3092\u8a2d\u5b9a\u3057\u3001\u81ea\u7528\u306e\u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u3068\u3057\u3066\u9451\u5b9a\u8a55\u4fa1\n\u3092\u884c\u3063\u305f\u3002\n\u30cf A\u304c\u571f\u5730\u306b\u3064\u3044\u3066\u65b0\u305f\u306b\u8cc3\u501f\u6a29\u3092\u8a2d\u5b9a\u3057\u3001\u5efa\u7269\u3092\u53d6\u5f97\u3059\u308b\u969b\u306e\u9451\u5b9a\u8a55\u4fa1\u3067\u3001\u4f9d\u983c\u76ee\u7684\n\u306b\u7167\u3089\u3057\u3066\u3001\u9451\u5b9a\u8a55\u4fa1\u66f8\u306e\u5229\u7528\u8005\u306e\u5229\u76ca\u3092\u5bb3\u3059\u308b\u304a\u305d\u308c\u304c\u306a\u3044\u304b\u3069\u3046\u304b\u306e\u89b3\u70b9\u304b\u3089\u59a5\u5f53\n\u6027\u304c\u8a8d\u3081\u3089\u308c\u305f\u305f\u3081\u3001\u53d6\u5f97\u5f8c\u306e\u72b6\u614b\u3092\u524d\u63d0\u3068\u3057\u305f\u5bfe\u8c61\u78ba\u5b9a\u6761\u4ef6\u3092\u8a2d\u5b9a\u3057\u3001\u501f\u5730\u6a29\u4ed8\u5efa\u7269\n\u3068\u3057\u3066\u9451\u5b9a\u8a55\u4fa1\u3092\u884c\u3063\u305f\u3002\n\u30cb \u5bfe\u8c61\u4e0d\u52d5\u7523\u304c\u6709\u6599\u8001\u4eba\u30db\u30fc\u30e0\u3067\u3042\u308a\u3001\u73fe\u884c\u8cc3\u8cb8\u501f\u5951\u7d04\u306b\u304a\u3051\u308b\u8cc3\u6599\u304c\u3001\u4e8b\u696d\u63a1\u7b97\u6027\u306e\n\u89b3\u70b9\u304b\u3089\u628a\u63e1\u3057\u305f\u9069\u6b63\u306a\u8cc3\u6599\u6c34\u6e96\u3088\u308a\u76f8\u5f53\u9ad8\u984d\u3067\u3042\u308b\u304c\u3001\u73fe\u306b\u8cc3\u8cb8\u501f\u306b\u4f9b\u3055\u308c\u3066\u3044\u308b\u3053\n\u3068\u304b\u3089\u3001\u4e8b\u696d\u63a1\u7b97\u6027\u306f\u7279\u306b\u8003\u616e\u305b\u305a\u3001\u73fe\u884c\u8cc3\u8cb8\u501f\u5951\u7d04\u306b\u304a\u3051\u308b\u8cc3\u6599\u306b\u3088\u308a\u5f97\u305f\u53ce 304f\u3001\u4e0d\u5408\u7406\u306a\u53c8\u306f\u500b\u4eba\u7684\u306a\u4e8b\u60c5\u306b\u3088\u308b\u4f7f\u7528\u65b9\u6cd5\u306e\u305f\u3081\u306b\u3001\u5f53\u8a72\u4e0d\u52d5\u7523\u304c\u5341\u5206\u306a\u52b9\u7528\n\u3092\u767a\u63ee\u3057\u3066\u3044\u306a\u3044\u5834\u5408\u304c\u3042\u308b\u3002\n\u30cf \u53d6\u5f15\u4e8b\u4f8b\u7b49\u306b\u4fc2\u308b\u53d6\u5f15\u7b49\u304c\u7279\u6b8a\u306a\u4e8b\u60c5\u3092\u542b\u3080\u3068\u304d\u306f\u4e8b\u60c5\u88dc\u6b63\u3057\u306a\u3051\u308c\u3070\u306a\u3089\u306a\u3044\u3002\n\u30cb \u53d6\u5f15\u7b49\u306b\u4fc2\u308b\u7279\u6b8a\u306a\u4e8b\u60c5\u3068\u306f\u3001\u6b63\u5e38\u4fa1\u683c\u3092\u6c42\u3081\u308b\u5834\u5408\u306b\u3001\u6b63\u5e38\u4fa1\u683c\u306e\u524d\u63d0\u3068\u306a\u308b\u73fe\u5b9f\n\u306e\u793e\u4f1a\u7d4c\u6e08\u60c5\u52e2\u306e\u4e0b\u3067\u5408\u7406\u7684\u3068\u8003\u3048\u3089\u308c\u308b\u8af8\u6761\u4ef6\u3092\u6b20\u304f\u306b\u81f3\u3089\u3057\u3081\u308b\u4e8b\u60c5\u3092\u3044\u3046\u3002\n\u30db \u7a4d\u7b97\u8cc3\u6599\u3092\u6c42\u3081\u308b\u306b\u5f53\u305f\u3063\u3066\u306e\u57fa\u790e\u4fa1\u683c\u306f\u3001\u8cc3\u501f\u4eba\u306e\u4e8b\u60c5\u306b\u3088\u3063\u3066\u4f7f\u7528\u65b9\u6cd5\u3092\u5236\u7d04\u3057\n\u3066\u3044\u308b\u5834\u5408\u3067\u6700\u6709\u52b9\u4f7f\u7528\u306e\u72b6\u614b\u3092\u78ba\u4fdd\u3067\u304d\u306a\u3044\u5834\u5408\u306b\u306f\u3001\u6700\u6709\u52b9\u4f7f\u7528\u304c\u5236\u7d04\u3055\u308c\u3066\u3044\u308b\n\u7a0b\u5ea6\u306b\u5fdc\u3058\u305f\u7d4c\u6e08\u4fa1\u5024\u306e\u6e1b\u5206\u3092\u8003\u616e\u3057\u3066\u6c42\u3081\u308b\u3002","choices":["\u30a4\u3068\u30cb","\u30a4\u3068\u30db","\u30ed\u3068\u30cf","\u30ed\u3068\u30cb","\u30cf\u3068\u30db"],"answer":4},{"questionNumber":16,"question":"\u539f\u4fa1\u6cd5\u306b\u95a2\u3059\u308b\u6b21\u306e\u30a4\u304b\u3089\u30db\u307e\u3067\u306e\u8a18\u8ff0\u306e\u3046\u3061\u3001\u6b63\u3057\u3044\u3082\u306e\u3092\u3059\u3079\u3066\u63b2\u3052\u305f\u7d44\n\u5408\u305b\u306f\ \u306b\u304a\u3051\u308b\u6700\u7d42\u5224\u65ad\u3067\u3042\u308b\u9451\u5b9a\n\u8a55\u4fa1\u984d\u306e\u6c7a\u5b9a\u306b\u5c0e\u304f\u4f5c\u696d\u3092\u3044\u3046\u3002","\u5404\u8a66\u7b97\u4fa1\u683c\u306e\u518d\u541f\u5473\u306b\u5f53\u305f\u3063\u3066\u306f\u3001\u5404\u624b\u6cd5\u306e\u9069\u7528\u306b\u304a\u3044\u3066\u884c\u3063\u305f\u5404\u7a2e\u88dc\u6b63\u3001\u4fee\u6b63\u7b49\u306b\n\u4fc2\u308b\u5224\u65ad\u306e\u9069\u5426\u3001\u5404\u624b\u6cd5\u306b\u5171\u901a\u3059\u308b\u4fa1\u683c\u5f62\u6210\u8981\u56e0\u306b\u4fc2\u308b\u5224\u65ad\u306e\u6574\u5408\u6027\u3001\u5358\u4fa1\u3068\u7dcf\u984d\u3068\u306e\n\u95a2\u9023\u306e\u9069\u5426\u7b49\u306b\u7559\u610f\u3059\u3079\u304d\u3067\u3042\u308b\u3002","\u8a66\u7b97\u4fa1\u683c\u304c\u6709\u3059\u308b\u8aac\u5f97\u529b\u306b\u4fc2\u308b\u5224\u65ad\u306b\u5f53\u305f\u3063\u3066\u306f\u3001\u7279\u306b\u5bfe\u8c61\u4e0d\u52d5\u7523\u306b\u4fc2\u308b\u5730\u57df\u5206\u6790\u53ca\n\u3073\u500b\u5225\u5206\u6790\u306e\u7d50\u679c\u3068\u5404\u624b\u6cd5\u3068\u306e\u9069\u5408\u6027\u3084\u3001\u5404\u624b\u6cd5\u306e\u9069\u7528\u306b\u304a\u3044\u3066\u63a1\u7528\u3057\u305f\u8cc7\u6599\u306e\u7279\u6027\u53ca\n\u3073\u9650\u754c\u304b\u3089\u304f\u308b\u76f8\u5bfe\u7684\u4fe1\u983c\u6027\u7b49\u306b\u7559\u610f\u3059\u3079\u304d\u3067\u3042\u308b\u3002","\u90fd\u5e02\u8a08\u753b\u6cd5\u7b2c5\u6761\u306b\u898f\u5b9a\u3059\u308b\u90fd\u9053\u5e9c\u770c\u304c\u5b9a\u3081\u308b\u90fd\u5e02\u8a08\u753b\u533a\u57df\u5185\u306b\u304a\u3044\u3066\u571f\u5730\u306e\u6b63\u5e38\u4fa1\n\u683c\u3092\u6c42\u3081\u308b\u3068\u304d\u306f\u3001\u516c\u793a\u4fa1\u683c\u3092\u898f\u6e96\u3068\u3057\u306a\u3051\u308c\u3070\u306a\u3089\u306a\u3044\u304c\u3001\u90fd\u5e02\u8a08\u753b\u533a\u57df\u5916\u306b\u304a\u3044\u3066\n\u306f\u516c\u793a\u4fa1\u683c\u3092\u898f\u6e96\u3068\u3059\u308b\u5fc5\u8981\u306f\u306a\u3044\u3002"],"answer":4},{"questionNumber":25,"question":"\u9451\u5b9a\u8a55\u4fa1\u5831\u544a\u66f8\u306e\u8a18\u8f09\u4e8b\u9805\u306b\u95a2\u3059\u308b\u6b21\u306e\u8a18\u8ff0\u306e\u3046\u3061\u3001\u8aa4\u3063\u3066\u3044\u308b\u3082\u306e\u306f\u3069\u308c\u304b\u3002","choices":["\u652f\u6255\u8cc3\u6599\u306e\u9451\u5b9a\u8a55\u4fa1\u3092\u4f9d\u983c\u3055\u308c\u305f\u5834\u5408\u306b\u304a\u3051\u308b\u9451\u5b9a\u8a55\u4fa1\u984d\u306e\u8a18\u8f09\u306f\u3001\u652f\u6255\u8cc3\u6599\u3067\u3042\u308b\n\u65e8\u3092\u4ed8\u8a18\u3057\u3066\u652f\u6255\u8cc3\u6599\u306e\u984d\u3092\u8868\u793a\u3059\u308b\u3068\u3068\u3082\u306b\u3001\u304b\u3063\u3053\u66f8\u304d\u3067\u5b9f\u8cea\u8cc3\u6599\u3067\u3042\u308b\u65e8\u3092\u4ed8\u8a18\n\u3057\u3066\u5b9f\u8cea\u8cc3\u6599\u306e\u984d\u3092\u4f75\u8a18\u3059\u308b\u304c\u3001\u652f\u6255\u8cc3\u6599\u3068\u5b9f\u8cea\u8cc3\u6599\u304c\u540c\u984d\u306e\u5834\u5408\u306f\u4f75\u8a18\u3092\u8981\u3057\u306a\u3044\u3002","\u7279\u6b8a\u4fa1\u683c\u3092\u6c42\u3081\u308b\u9451\u5b9a\u8a55\u4fa1\u3067\u3001\u7279\u6b8a\u4fa1\u683c\u3068\u6b63\u5e38\u4fa1\u683c\u304c\u7570\u306a\u308b\u5834\u5408\u306b\u306f\u304b\u3063\u3053\u66f8\u304d\u3067\u6b63\n\u5e38\u4fa1\u683c\u3067\u3042\u308b\u65e8\u3092\u4ed8\u8a18\u3057\u3066\u6b63\u5e38\u4fa1\u683c\u3092\u4f75\u8a18\u3057\u306a\u3051\u308c\u3070\u306a\u3089\u306a\u3044\u3002","\u5bfe\u8c61\u4e0d\u52d5\u7523\u306e\u78ba\u8a8d\u306b\u95a2\u3059\u308b\u4e8b\u9805\u3068\u3057\u3066\u3001\u5b9f\u5730\u8abf\u67fb\u3092\u884c\u3063\u305f\u3059\u3079\u3066\u306e\u4e0d\u52d5\u7523\u9451\u5b9a\u58eb\u306e\u6c0f\n\u540d\u3092\u8a18\u8f09\u3059\u308b\u3002","\u5bfe\u8c61\u4e0d\u52d5\u7523\u306e\u78ba\u8a8d\u306b\u3064\u3044\u3066\u306f\u3001\u78ba\u8a8d\u65b9\u6cd5(\u66f8\u9762\u306b\u3088\u308b\u3082\u306e\u304b\u3001\u53e3\u982d\u306b\u3088\u308b\u3082\u306e\u304b\u306e\u5225\n\u7b49\u3092\u3044\u3046\u3002)\u53ca\u3073\u78ba\u8a8d\u8cc7\u6599\u306b\u3064\u3044\u3066\u8a18\u8f09\u3057\u3001\u540c\u4e00\u306e\u4e0d\u52d5\u7523\u306e\u518d\u8a55\u4fa1\u3092\u884c\u3046\u583 5e95\u5730\u306e\u9451\u5b9a\u8a55\u4fa1\u306b\u95a2\u3059\u308b\u6b21\u306e\u30a4\u304b\u3089\u30db\u307e\u3067\u306e\u8a18\u8ff0\u306e\u3046\u3061\u3001\u8aa4\u3063\u3066\u3044\n\u308b\u3082\u306e\u3092\u3059\u3079\u3066\u63b2\u3052\u305f\u7d44\u5408\u305b\u306f\u3069\u308c\u304b\u3002\n\u30a4 \u501f\u5730\u6a29\u306e\u4fa1\u683c\u306f\u3001\u501f\u5730\u501f\u5bb6\u6cd5(\u5ec3\u6b62\u524d\u306e\u501f\u5730\u6cd5\u3092\u542b\u3080\u3002)\u306b\u57fa\u3065\u304d\u571f\u5730\u3092\u4f7f\u7528\u53ce\u76ca\u3059\u308b\n\u3053\u3068\u306b\u3088\u308a\u501f\u5730\u6a29\u8005\u306b\u5e30\u5c5e\u3059\u308b\u7d4c\u6e08\u7684\u5229\u76ca\u3092\u8ca8\u5e63\u984d\u3067\u8868\u793a\u3057\u305f\u3082\u306e\u3067\u3042\u308b\u304c\u3001\u3053\u306e\u7d4c\u6e08\n\u7684\u5229\u76ca\u306b\u306f\u4e00\u6642\u91d1\u306e\u6388\u53d7\u306b\u57fa\u3065\u304f\u3082\u306e\u3082\u542b\u307e\u308c\u308b\u3002\n\u30ed \u501f\u5730\u6a29\u306e\u9451\u5b9a\u8a55\u4fa1\u306b\u5f53\u305f\u3063\u3066\u306f\u3001\u501f\u5730\u6a29\u306e\u53d6\u5f15\u6163\u884c\u306e\u6210\u719f\u306e\u7a0b\u5ea6\u306e\u9ad8\u4f4e\u306b\u304b\u304b\u308f\u3089\u305a\u3001\n\u571f\u5730\u6b8b\u4f59\u6cd5\u306b\u3088\u308b\u53ce\u76ca\u4fa1\u683c\u53ca\u3073\u5f53\u8a72\u501f\u5730\u6a29\u306e\u8a2d\u5b9a\u5951\u7d04\u306b\u57fa\u3065\u304f\u8cc3\u6599\u5dee\u984d\u306e\u3046\u3061\u53d6\u5f15\u306e\u5bfe\n\u8c61\u3068\u306a\u3063\u3066\u3044\u308b\u90e8\u5206\u3092\u9084\u5143\u3057\u3066\u5f97\u305f\u4fa1\u683c\u306f\u3001\u9451\u5b9a\u8a55\u4fa1\u984d\u3092\u6c7a\u5b9a\u3059\u308b\u305f\u3081\u306e\u8a66\u7b97\u4fa1\u683c\u3068\u306a\n\u308b\u3002\n\u30cf \u5b85\u5730\u306e\u8cc3\u8cb8\u501f\u5951\u7d04\u7b49\u306b\u95a2\u9023\u3057\u3066\u3001\u501f\u5730\u6a29\u8005\u304b\u3089\u501f\u5730\u6a29\u8a2d\u5b9a\u8005\u3078\u652f\u6255\u308f\u308c\u308b\u4e00\u6642\u91d1\u306f\u3001\n\u4e00\u822c\u306b\u30011\u9810\u308a\u91d1\u7684\u6027\u683c\u3092\u6709\u3057\u3001\u901a\u5e38\u3001\u4fdd\u8a3c\u91d1\u3068\u547c\u 2e\u5e02\u8857\u5730\u518d\u958b\u767a\u4e8b\u696d\u306b\u304a\u3044\u3066\u3001\u6a29\u5229\u5909\u63db\u8a08\u753b\u306b\n\u8a18\u8f09\u3059\u308b\u5f93\u524d\u8cc7\u7523\u306e\u4fa1\u984d\u306f\u3001\u5f53\u8a72\u7d44\u5408\u306e\u8a2d\u7acb\u8a8d\u53ef\u306e\u516c\u544a\u304b\u3089 30 \u65e5\u306e\u671f\u9593\u3092\u7d4c\u904e\u3057\n\u305f\u65e5\u306b\u304a\u3051\u308b\u8fd1\u508d\u985e\u4f3c\u306e\u571f\u5730\u3001\u8fd1\u508d\u540c\u7a2e\u306e\u5efa\u7bc9\u7269\u53c8\u306f\u8fd1\u508d\u985e\u4f3c\u306e\u571f\u5730\u82e5\u3057\u304f\u306f\u8fd1\u508d\n\u540c\u7a2e\u306e\u5efa\u7bc9\u7269\u306b\u95a2\u3059\u308b\u540c\u7a2e\u306e\u6a29\u5229\u306e\u53d6\u5f15\u4fa1\u683c\u7b49\u3092\u8003\u616e\u3057\u3066\u5b9a\u3081\u308b\u76f8\u5f53\u306e\u4fa1\u984d\u3068\u3057\u306a\n\u3051\u308c\u3070\u306a\u3089\u306a\u3044\u3002\u3053\u308c\u306f\u3001\u65bd\u884c\u5730\u533a\u5185\u306e\u6a29\u5229\u8005\u7b49\u306e\u5168\u3066\u306e\u540c\u610f\u3092\u5f97\u305f\u5834\u5408\u3082\u540c\u69d8\u3067\n\u3042\u308b\u3002\n\u30ed \u7b2c\u4e00\u7a2e\u5e02\u8857\u5730\u518d\u958b\u767a\u4e8b\u696d\u306e\u65bd\u884c\u8005\u304c\u571f\u5730\u8abf\u66f8\u53ca\u3073\u7269\u4ef6\u8abf\u66f8\u3092\u4f5c\u6210\u3059\u308b\u5834\u5408\u306b\u304a\u3044\n\u3066\u3001\u571f\u5730\u8abf\u66f8\u53c8\u306f\u7269\u4ef6\u8abf\u66f8\u306e\u8a18\u8f09\u306b\u3064\u3044\u3066\u95a2\u4fc2\u6a29\u5229\u8005\u306e\u3059\u3079\u3066\u306b\u7570\u8b70\u304c\u306a\u3044\u3068\u304d\u306f\u3001\n\u571f\u5730\u6240\u6709\u8005\u53ca\u3073\u95a2\u4fc2\u4eba\u306e\u7acb\u4f1a\u3044\u3092\u7701\u7565\u3059\u308b\u3053\u3068\u304c\u3067\u304d\u308b\u3002\n\u30cf \u65bd\u884c\u5730\u533a\u5185\u306e\u571f\u5730(\u6307\u5b9a\u5b85\u5730\u3092\u9664\u304f\u3002)\u306b\u6a29\u539f\u306b\u57fa\u3065\u304d\u5efa\u7bc9\u7269\u3092\u6240\u6709\u3059\u308b\u8005\u304c\u3001\n\u81ea\u5df1\u306e\u6709\u3059\u308b\u5efa\u7bc9\u7269\u3092\u65bd\u884c\u5730\u533a\u5916\u306b\u79fb\u8ee2\u3059\u3079\u304d\u65e8\u3092\u7533\u3057\u51fa\u305f\u5834\u5408\u3067\u3042\u3063\u3066\u3082\u3001\u5f53\u8a72\n\u5efa\u7bc9\u7269\u306f\u3001\u6a29\u5229\u5909\u63db\u671f\u65e5\u306b\u304a\u3044\u3066\u65bd\u884c\u8005\u306b\u5e30\u5c5e\u3059\u308b\u3002\n\u30cb \u65bd\u884c\u5730\u533a\u5185\u306b\u5b58\u3059\u308b\u571f\u5730\u306e\u6240\u6709\u8005\u306f\u3001\u6a29\u5229\u5909\u63db\u671f\u65e5\u5f8c\u9045\u6ede\u306a\u304f\u3001\u5f93\u524d\u6240\u6709\u3057\u3066\u3044\n\u305f\u571f\u5730\u306e\u8868\u984c\u90e8\u306e\u767b\u8a18\u306e\u62b9\u6d88\u3092\u7533\u8acb\u3057\u3001\u53c8\u306f\u5631\u8a17\u3057\u306a\u3051\u308c\u3070\u306a\u3089\u306a\u3044\u3002\n\u30db \u65bd\u884c\u5730\u533a\u5185\u306e\u571f\u5730\u3092\u6240\u6709\u6a29\u306b\u57fa\u3065\u304d\u5360\u6709\u3057\u3066\u3044\u305f\u8005\u306f\u3001\u6a29\u5229\u5909\u63db\u671f\u65e5\u4ee5\u964d\u3082\u3001\u65bd\n\u884c\u8005\u304c\u901a\u77e5\u3057\u305f\u660e\u6e21\u3057\u306e\u671f\u9650\u307e\u3067\u306f\u3001\u5f93\u524d\u306e\u7528\u6cd5\u306b\u5f93\u3044\u3001\u305d\u306e\u5360\u6709\u3092\u7d99\u7d9a\u3059\u308b\u3053\u3068\n\u304c\u3067\u304d\u308b\u3002","choices":["\u30a4\u3068\u30ed","\u30a4\u3068\u30cb","\u30ed\u3068\u30db","\u30cf\u3068\u30cb","\u30cf\u3068\u30db"],"answer":2},{"questionNumber":15,"question":"\u666f\u89b3\u6cd5\u306b\u95a2\u3059\u308b\u6b21\u306e\u8a18\u8ff0\u306e\u3046\u3061\u3001\u8aa4\u3063\u3066\u3044\u308b\u3082\u306e\u306f\u3069\u308c\u304b\u3002","choices":["\u56fd\u306e\u6a5f\u95a2\u304c\u3001\u666f\u89b3\u91cd\u8981\u5efa\u9020\u7269\u306e\u5897\u7bc9\u3001\u6539\u7bc9\u3001\u79fb\u8ee2\u82e5\u3057\u304f\u306f\u9664\u53bb\u3001\u5916\u89b3\u3092\u5909\u66f4\u3059\u308b\n\u3053\u3068\u3068\u306a\u308b\u4fee\u7e55\u82e5\u3057\u304f\u306f\u6a21\u69d8\u66ff\u53c8\u306f\u8272\u5f69\u306e\u5909\u66f4\u3092\u3057\u3088\u3046\u3068\u3059\u308b\u5834\u5408\u306f\u3001\u666f\u89b3\u884c\u653f\u56e3\n\u4f53\u306e\u9577\u306e\u8a31\u53ef\u3092\u5fc5\u8981\u3068\u3057\u306a\u3044\u304c\u3001 u5024\u306e\u3046\u3061\u3001( \u30a4 )\u306e\u5206\u5272\u306b\u3088\u308b\u5f53\u8a72\u6a29\u5229\u306e\u8a2d\u5b9a\u90e8\u5206\u306e\u7d4c\n\u6e08\u4fa1\u5024\u53ca\u3073\u8a2d\u5b9a\u90e8\u5206\u306e\u52b9\u7528\u3092\u4fdd\u6301\u3059\u308b\u305f\u3081\u3001\u4ed6\u306e\u7a7a\u9593\u90e8\u5206\u306e\u5229\u7528\u3092\u5236\u9650\u3059\u308b\u3053\u3068\u306b\u76f8\u5fdc\u3059\u308b\n\u7d4c\u6e08\u4fa1\u5024\u3092\u8ca8\u5e63\u984d\u3067\u8868\u793a\u3057\u305f\u3082\u306e\u3067\u3042\u308b\u3002\n\u3053\u306e\u5834\u5408\u306e\u533a\u5206\u5730\u4e0a\u6a29\u306e\u9451\u5b9a\u8a55\u4fa1\u984d\u306f\u3001( \u30ed )\u7b49\u306b\u57fa\u3065\u304f\u6bd4\u6e96\u4fa1\u683c\u3001\u571f\u5730\u6b8b\u4f59\u6cd5\u306b\u6e96\n\u3058\u3066\u6c42\u3081\u305f\u53ce\u76ca\u4fa1\u683c\u53ca\u3073\u533a\u5206\u5730\u4e0a\u6a29\u306e\u7acb\u4f53\u5229\u7528\u7387\u306b\u3088\u308a\u6c42\u3081\u305f\u4fa1\u683c\u3092\u95a2\u9023\u3065\u3051\u3066\u5f97\u305f\u4fa1\u683c\u3092\n\u6a19\u6e96\u3068\u3057\u3001\u533a\u5206\u5730\u4e0a\u6a29\u306e\u8a2d\u5b9a\u4e8b\u4f8b\u7b49\u306b\u57fa\u3065\u304f\u533a\u5206\u5730\u4e0a\u6a29\u5272\u5408\u306b\u3088\u308a\u6c42\u3081\u305f\u4fa1\u683c\u3092\u6bd4\u8f03\u8003\u91cf\u3057\n\u3066\u6c7a\u5b9a\u3059\u308b\u3082\u306e\u3068\u3059\u308b\u3002\n\u533a\u5206\u5730\u4e0a\u6a29\u306f\u3001\u4ed6\u4eba\u306e\u571f\u5730\u306e\u5730\u4e0b\u53c8\u306f\u7a7a\u9593\u306e\u4e00\u90e8\u306b\u5de5\u4f5c\u7269\u3092\u8a2d\u7f6e\u3059\u308b\u3053\u3068\u3092\u76ee\u7684\u3068\u3057\u3066\u8a2d\n\u5b9a\u3059\u308b\u6a29\u5229\u3067\u3042\u308a\u3001\u305d\u306e\u5de5\u4f5c\u7269\u306e\u69cb\u9020\u3001\u7528\u9014\u3001\u4f7f\u7528\u76ee\u7684\u3001( \u30cf )\u7b49\u306b\u3088\u308a\u3001\u305d\u306e\u7d4c\u6e08\u4fa1\n\u5024\u304c\u7279\u5b9a\u3055\u308c\u308b\u3002","choices":["\u30a4 \u5e73\u9762\u7684\u30fb\u7acb\u4f53\u7684\u7a7a\u9593 \u30ed \u53d6\u5f15\u4e8b\u4f8b \u30cf \u6a29\u5229\u306e\u8a2d\u5b9a\u671f\u9593","\u30a4 \u5e73\u9762\u7684\u30fb\u7acb\u4f53\u7684\u7a7a\u9593 \u30ed \u8a2d\u5b9a\u4e8b\u4f8b \u30cf \u6a29\u5229\u306e\u8a2d\u5b9a\u671f\u9593","\u30a4 \u5e73\u9762\u7684\u30fb\u7acb\u4f53\u7684\u7a7a\u9593 \u30ed \u8a2d\u5b9a\u4e8b\u4f8b \u30cf \u8010\u7528\u5e74\u6570","\u30a4 \u6642\u9593\u7684\u30fb\u7a7a\u9593\u7684\u7bc4\u56f2 \u30ed \u53d6\u5f15\u4e8b\u4f8b \u30cf \u6a29\u5229\u306e\u8a2d\u5b9a\u671f\u9593","\u30a4 \u6642\u4fa1\u7684\u30fb\u7a7a\u9593\u7684\u7bc4\u56f2 \u30ed \u8a2d\u5b9a\u4e8b\u4f8b \u30cf \u8010\u7528\u5e74\u6570"],"answer":1},{"questionNumber":27,"question":"\u5b85\u5730\u898b\u8fbc\u5730\u306e\u9451\u5b9a\u8a55\u4fa1\u306b\u95a2\u3059\u308b\u6b21\u306e\u30a4\u304b\u3089\u30db\u307e\u3067\u306e\u8a18\u8ff0\u306e\u3046\u3061\u3001\u8aa4\u3063\u3066\u3044\u308b\u3082\n\u306e\u3092\u3059\u3079\u3066\u63b2\u3052\u305f\u7d44\u5408\u305b\u306f\u3069\u308c\u304b\u3002\n\u30a4 \u5b85\u5730\u898b\u8fbc\u5730\u306e\u9451\u5b9a\u8a55\u4fa1\u306b\u5f53\u305f\u3063\u3066\u306f\u3001\u4ed8\u8fd1\u306b\u304a\u3051\u308b\u516c\u5171\u65bd\u8a2d\u53ca\u3073\u516c\u76ca\u7684\u65bd\u8a2d\u306e\u6574\u5099\u306e\n\u52d5\u5411\u3092\u52d8\u6848\u3059\u308b\u3082\u306e\u3068\u3059\u308b\u3002\n\u30ed \u5b85\u5730\u898b\u8fbc\u5730\u306e\u9451\u5b9a\u8a55\u4fa1\u306b\u5f53\u305f\u3063\u3066\u306f\u3001\u9020\u6210\u306e\u96e3\u6613\u53ca\u3073\u305d\u306e\u5fc5\u8981\u306e\u7a0b\u5ea6\u3092\u52d8\u6848\u3059\u308b\u3082\u306e\n\u3068\u3059\u308b\u3002\n\u30cf \u719f\u6210\u5ea6\u306e\u4f4e\u3044\u5b85\u5730\u898b\u8fbc\u5730\u3092\u9451\u5b9a\u8a55\u4fa1\u3059\u308b\u5834\u5408\u306b\u306f\u3001\u6bd4\u6e96\u4fa1\u683c\u3092\u6a19\u6e96\u3068\u3057\u3001\u8ee2\u63db\u5f8c\u306e\u571f\n\u5730\u306e\u7a2e\u5225\u306b\u57fa\u3065\u304f\u4fa1\u683c\u3092\u5f53\u8a72\u5b85\u5730\u898b\u8fbc\u5730\u306e\u719f\u6210\u5ea6\u306b\u5fdc\u3058\u3066\u9069\u5207\u306b\u4fee\u6b63\u3057\u3066\u5f97\u305f\u4fa1\u683c\u3092\u6bd4\n\u8f03\u8003\u91cf\u3057\u3066\u6c7a\u5b9a\u3059\u308b\u3082\u306e\u3068\u3059\u308b\u3002\n\u30cb \u6797\u5730\u5730\u57df\u304b\u3089\u4f4f\u5b85\u5730\u57df\u3078\u3068\u8ee2\u63db\u3057\u3064\u3064\u3042\u308b\u5730\u57df\u306e\u3046\u3061\u306b\u3042\u308b\u571f\u5730\u306e\u5730\u57df\u5206\u6790\u306b\u5f53\u305f\u3063\n\u3066\u3001\u8ee2\u63db\u306e\u7a0b\u5ea6\u304c\u4f4e\u3044\u5834\u5408\u306b\u304a\u3044\u3066\u306f\u3001\u4e00\u822c\u306b\u300c\u90fd\u5fc3\u3068\u306e\u8ddd\u96e2\u53ca\u3073\u4ea4\u901a\u65bd\u8a2d\u306e\u72b6\u614b\u300d\u3088\n\u308a\u3082\u300c\u6797\u9053\u7b49\u306e\u6574\u5099\u306e\u72b6\u614b\u300d\u3092\u91cd\u8996\u3059\u3079\u304d\u3067\u3042\u308b\u3002\n\u30db \u8fb2\u5730\u5730\u57df\u304b\u3089\u5b85\u5730\u5730\u57df\u3078\u3068\u8ee2\u63db\u3057\u3064\u3064\u3042\u308b\u5730\u57df\u306e\u3046\u3061\u306b\u3042\u308b\u571f\u5730\u306e\u9451\u5b9a\u8a55\u4fa1\u306b\u5f53\u305f\u3063\n\u3066\u306f\u3001\u4e3b\u3068\u3057\u3066\u8fb2\u5730\u3068\u3057\u3066\u306e\u6709\u52b9\u5229\u7528\u5ea6\u3092\u52d8\u6848\u3059\u308b\u3082\u306e\u3068\u3059\u308b\u3002","choices":["\u30a4\u3068\u30cb","\u30a4\u3068\u30db","\u30ed\u3068\u30cf","\u30ed\u3068\u30cb","\u30cf\u3068\u30db"],"answer":4},{"questionNumber":28,"question":"\u501f\u5730\u6a29\u4ed8\u5efa\u7269\u306e\u9451\u5b9a\u8a55\u4fa1\u306b\u95a2\u3059\u308b\u6b21\u306e\u8a18\u8ff0\u306e\u3046\u3061\u3001\u8aa4\u3063\u3066\u3044\u308b\u3082\u306e\u306f\u3069\u308c\u304b\u3002","choices":["\u501f\u5730\u6a29\u306e\u614b\u69d8\u304c\u5b9a\u671f\u501f\u5730\u6a29\u3067\u3042\u308b\u5834\u5408\u3001\u5951\u7d04\u671f\u9593\u306e\u6e80\u4e86\u306b\u4f34\u3046\u66f4\u65b0\u304c\u306a\u304f\u3001\u501f\u5730\u5951\u7d04\n\u304c\u5fc5\u305a\u7d42\u4e86\u3059\u308b\u305f\u3081\u3001\u53ce\u76ca\u9084\u5143\u6cd5\u3092\u9069\u7528\u3059\u308b\u306b\u5f53\u305f\u3063\u3066\u306f\u3001\u53ce\u76ca\u671f\u9593\u304c\u6709\u671f\u3067\u3042\u308b\u3053\u3068\n\u3092\u524d\u63d0\u3068\u3057\u305f\u6709\u671f\u9084\u5143\u6cd5\u7b49\u3092\u9069\u7528\u3059\u308b\u3053\u3068\u304c\u9069\u5207\u3067\u3042\u308b\u3002","\u501f\u5730\u6a29\u306e\u614b\u69d8\u304c\u5b9a\u671f\u501f\u5730\u6a29\u3067\u3042\u308b\u5834\u5408\u3001\u5951\u7d04\u671f\u9593\u306e\u6e80\u4e86\u306b\u4f34\u3046\u66f4\u65b0\u304c\u306a\u304f\u3001\u501f\u5730\u5951\u7d04\n\u304c\u5fc5\u305a\u7d42\u4e86\u3059\u308b\u305f\u3081\u3001\u4e00\u822c\u306b\u501f\u5730\u5951\u7d04\u306e\u6b8b\u5b58\u671f\u9593\u304c\u77ed\u304f\u306a\u308b\u306b\u5f93\u3044\u3001\u501f\u5730\u6a29\u4ed8\u5efa\u7269\u306e\u7d4c\n\u6e08\u4fa1\u5024\u306f\u4f4e\u4e0b\u3059\u308b\u3068\u8003\u3048\u3089\u308c\u308b\u3002","\u5c06\u6765\u306e\u58f2\u5374\u3092\u60f3\u5b9a\u3057\u3066DCF\u6cd5\u3092\u9069\u7528\u3059\u308b\u306b\u5f53\u305f\u3063\u3066\u3001\u58f2\u5374\u306b\u5f53\u305f\u308a\u8b72\u6e21\u627f\u8afe\u6599\u3001\u540d\n\u7fa9\u66f8\u63db\u6599\u7b49\u306e\u4e00\u6642\u91d1\u306e\u6388\u53d7\u304c\u898b\u8fbc\u307e\u308c\u308b\u5834\u5408\u306b\u306f\u3001\u5f53\u8a72\u4e00\u6642\u91d1\u306e\u984d\u304c\u501f\u5730\u6a29\u4ed8\u5efa\u7269\u306e\u7d4c\n\u6e08\u4fa1\u5024\u3092\u9ad8\u3081\u308b\u8981\u56e0\u306b\u306a\u308b\u3068\u8003\u3048\u3089\u308c\u308b\u3002","\u539f\u4fa1\u6cd5\u3092\u9069\u7528\u3059\u308b\u306b\u5f53\u305f\u3063\u3066\u3001\u5efa\u7269\u306e\u958b\u767a\u671f\u9593\u4e2d\u306b\u304a\u3044\u3066\u3082\u5730\u4ee3\u3092\u652f\u6255\u3046\u5834\u5408\u306b\u306f\u3001\n\u767a\u6ce8\u8005\u304c\u76f4\u63a5\u8ca0\u62c5\u3059\u3079\u304d\u901a\u5e38\u306e\u4ed8\u5e2f\u8cbb\u7528\u3068\u3057\u3066\u5f53\u8a72\u671f\u9593\u4e2d\u306e\u5730\u4ee3\u76f8\u5f53\u984d\u3092\u9069\u5207\u306b\u8003\u616e\u3059\n\u308b\u3002","\u53ce\u76ca\u9084\u5143\u6cd5\u3092\u9069\u7528\u3059\u308b\u306b\u5f53\u305f\u3063\u3066\u3001\u7dcf\u8cbb\u7528\u306e\u67fb\u5b9a\u306b\u304a\u3044\u3066\u306f\u3001\u571f\u5730\u306e\u516c\u79df\u516c\u8ab2(\u56fa\u5b9a\n\u8cc7\u7523\u7a0e\u3001\u90fd\u5e02\u8a08\u753b\u7a0e)\u3067\u306f\u306a\u304f\u652f\u6255\u5730\u4ee3\u3092\u8a08\u4e0a\u3059\u3079\u304d\u3067\u3042\u308b\u3002"],"answer":2},{"questionNumber":29,"question":"\u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u306e\u9451\u5b9a\u8a55\u4fa1\u306b\u95a2\u3059\u308b\u6b21\u306e\u30a4\u304b\u3089\u30db\u307e\u3067\u306e\u8a18\u8ff0\u306e\u3046\u3061\u3001\u6b63\u3057\u3044\n\u3082\u306e\u3092\u3059\u3079\u3066\u63b2\u3052\u305f\u7d44\u5408\u305b\u306f\u3069\u308c\u304b\u3002\n\u30a4 \u501f\u5730\u6a29\u4ed8\u5efa\u7269\u3067\u3001\u5f53\u8a72\u5efa\u7269\u3092\u501f\u5730\u6a29\u8005\u304c\u4f7f\u7528\u3057\u3066\u3044\u308b\u3082\u306e\u306b\u3064\u3044\u3066\u306e\u9451\u5b9a\u8a55\u4fa1\u984d\u306f\u3001\n\u7a4d\u7b97\u4fa1\u683c\u3001\u6bd4\u6e96\u4fa1\u683c\u53ca\u3073\u53ce\u76ca\u4fa1\u683c\u3092\u95a2\u9023\u3065\u3051\u3066\u6c7a\u5b9a\u3059\u308b\u3082\u306e\u3068\u3059\u308b\u304c\u3001\u3053\u306e\u5834\u5408\u306b\u304a\u3044\n\u3066\u306f\u3001\u501f\u5730\u6a29\u8a2d\u5b9a\u5951\u7d04\u306b\u5f53\u305f\u3063\u3066\u6388\u53d7\u3055\u308c\u305f\u4e00\u6642\u91d1\u306e\u3046\u3061\u3001\u9810\u308a\u91d1\u7684\u6027\u683c\u3092\u6709\u3059\u308b\u4e00\u6642\n\u91d1\u306e\u984d\u3092\u8003\u616e\u3059\u308b\u5fc5\u8981\u306f\u306a\u3044\u3002\n\u30ed \u533a\u5206\u6240\u6709\u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u306e\u78ba\u8a8d\u306b\u5f53\u305f\u3063\u3066\u306f\u3001\u7ba1\u7406\u898f\u7d04\u3092\u78ba\u8a8d\u3059\u308b\u5fc5\u8981\u304c\u3042\u308b\u304c\u3001\n\u500b\u4eba\u60c5\u5831\u4fdd\u8b77\u306e\u89b3\u70b9\u304b\u3089\u533a\u5206\u6240\u6709\u8005\u306e\u7ba1\u7406\u8cbb\u7b49\u306e\u6ede\u7d0d\u306e\u6709\u7121\u306f\u78ba\u8a8d\u3059\u308b\u5fc5\u8981\u306f\u306a\u3044\u3002\n\u30cf \u8cb8\u5bb6\u53ca\u3073\u305d\u306e\u6577\u5730\u3092\u5f53\u8a72\u501f\u5bb6\u4eba\u304c\u8cb7\u3044\u53d6\u308b\u5834\u5408\u306b\u304a\u3051\u308b\u8cb8\u5bb6\u53ca\u3073\u305d\u306e\u6577\u5730\u306e\u9451\u5b9a\u8a55\u4fa1\n\u306b\u5f53\u305f\u3063\u3066\u306f\u3001\u5f53\u8a72\u8cb8\u5bb6\u53ca\u3073\u305d\u306e\u6577\u5730\u304c\u81ea\u7528\u306e\u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u3068\u306a\u308b\u3053\u3068\u306b\u3088\u308b\u5e02\u5834\n\u6027\u306e\u56de\u5fa9\u7b49\u306b\u5373\u5fdc\u3059\u308b\u7d4c\u6e08\u4fa1\u5024\u306e\u5897\u5206\u304c\u751f\u305a\u308b\u5834\u5408\u304c\u3042\u308b\u304c\u3001\u5f53\u8a72\u5897\u5206\u4fa1\u5024\u3092\u8003\u616e\u3057\u3066\n\u9451\u5b9a\u8a55\u4fa1\u3092\u884c\u3046\u5834\u5408\u3001\u6c42\u3081\u308b\u4fa1\u683c\u306e\u7a2e\u985e\u306f\u9650\u5b9a\u4fa1\u683c\u3067\u3042\u308b\u3002\n\u30cb \u8cb8\u5bb6\u53ca\u3073\u305d\u306e\u6577\u5730\u306f\u3001\u5efa\u7269\u6240\u6709\u8005\u3068\u305d\u306e\u6577\u5730\u306e\u6240\u6709\u8005\u304c\u540c\u4e00\u4eba\u3067\u3042\u308b\u304b\u3089\u3001\u8cb8\u5bb6\u53ca\u3073\n\u305d\u306e\u6577\u5730\u306e\u9451\u5b9a\u8a55\u4fa1\u306b\u5f53\u305f\u3063\u3066\u306f\u3001\u501f\u5730\u6a29\u306e\u53d6\u5f15\u6163\u884c\u53ca\u3073\u5e95\u5730\u306e\u53d6\u5f15\u5229\u56de\u308a\u3092\u52d8\u6848\u3059\u308b\n\u5fc5\u8981\u306f\u306a\u3044\u3002\n\u30db \u5efa\u7269\u3092\u53d6\u308a\u58ca\u3059\u3053\u3068\u304c\u6700\u6709\u52b9\u4f7f\u7528\u3068\u8a8d\u3081\u3089\u308c\u308b\u5834\u5408\u306b\u304a\u3051\u308b\u81ea\u7528\u306e\u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\n\u306e\u9451\u5b9a\u8a55\u4fa1\u984d\u306f\u3001\u5f53\u8a72\u6577\u5730\u306e\u6700\u6709\u52b9\u4f7f\u7528\u306b\u57fa\u3065\u304f\u4fa1\u683c\u3088\u308a\u3082\u5fc5\u305a\u4f4e\u304f\u306a\u308b\u3002","choices":["\u30a4\u3068\u30cb","\u30a4\u3068\u30db","\u30ed\u3068\u30cf","\u30ed\u3068\u30db","\u30cf\u3068\u30cb"],"answer":4},{"questionNumber":30,"question":"\u300c\u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u300d\u4e26\u3073\u306b\u300c\u5efa\u7269\u300d\u306e\u9451\u5b9a\u8a55\u4fa1\u306b\u95a2\u3059\u308b\u6b21\u306e\u30a4\u304b\u3089\u30db\u307e\u3067\u306e\n\u8a18\u8ff0\u306e\u3046\u3061\u3001\u8aa4\u3063\u3066\u3044\u308b\u3082\u306e\u3092\u3059\u3079\u3066\u63b2\u3052\u305f\u7d44\u5408\u305b\u306f\u3069\u308c\u304b\u3002\n\u30a4 \u533a\u5206\u6240\u6709\u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u306e\u7a4d\u7b97\u4fa1\u683c\u306f\u3001\u533a\u5206\u6240\u6709\u5efa\u7269\u306e\u5bfe\u8c61\u3068\u306a\u3063\u3066\u3044\u308b\u4e00\u68df\u306e\u5efa\n\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u306e\u7a4d\u7b97\u4fa1\u683c\u3092\u6c42\u3081\u3001\u5f53\u8a72\u7a4d\u7b97\u4fa1\u683c\u306b\u5f53\u8a72\u4e00\u68df\u306e\u5efa\u7269\u306e\u5404\u968e\u5c64\u5225\u53ca\u3073\u540c\u4e00\n\u968e\u5c64\u5185\u306e\u4f4d\u7f6e\u5225\u306e\u52b9\u7528\u6bd4\u306b\u3088\u308a\u6c42\u3081\u305f\u914d\u5206\u7387\u3092\u4e57\u305a\u308b\u3053\u3068\u306b\u3088\u308a\u6c42\u3081\u308b\u3082\u306e\u3068\u3059\u308b\u3002\n\u30ed \u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u304c\u4e00\u4f53\u3068\u3057\u3066\u5e02\u5834\u6027\u3092\u6709\u3059\u308b\u5834\u5408\u306b\u304a\u3051\u308b\u5efa\u7269\u306e\u307f\u306e\u9451\u5b9a\u8a55\u4fa1\u306f\u3001\n\u5efa\u7269\u304c\u305d\u306e\u6577\u5730\u3068\u4e00\u4f53\u5316\u3057\u3066\u3044\u308b\u72b6\u614b\u3092\u524d\u63d0\u3068\u3057\u3066\u3001\u305d\u306e\u5168\u4f53\u306e\u9451\u5b9a\u8a55\u4fa1\u984d\u306e\u5185\u8a33\u3068\u3057\n\u3066\u5efa\u7269\u306b\u3064\u3044\u3066\u90e8\u5206\u9451\u5b9a\u8a55\u4fa1\u3092\u884c\u3046\u3082\u306e\u3067\u3042\u308b\u3002\u3053\u306e\u5834\u5408\u306b\u304a\u3044\u3066\u306f\u3001\u8907\u5408\u4e0d\u52d5\u7523\u4fa1\u683c\n\u304b\u3089\u66f4\u5730\u4fa1\u683c\u3092\u63a7\u9664\u3057\u3066\u6c42\u3081\u305f\u4fa1\u683c\u3092\u6a19\u6e96\u3068\u3057\u3066\u9451\u5b9a\u8a55\u4fa1\u984d\u3092\u6c7a\u5b9a\u3059\u308b\u3082\u306e\u3068\u3059\u308b\u3002\n\u30cf \u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u304c\u4e00\u4f53\u3068\u3057\u3066\u5e02\u5834\u6027\u3092\u6709\u3057\u306a\u3044\u5834\u5408\u306b\u304a\u3051\u308b\u5efa\u7269\u306e\u307f\u306e\u9451\u5b9a\u8a55\u4fa1\u306f\u3001\n\u6587\u5316\u8ca1\u306e\u6307\u5b9a\u3092\u53d7\u3051\u305f\u5efa\u9020\u7269\u53c8\u306f\u5b97\u6559\u5efa\u7bc9\u7269\u7b49\u306b\u3064\u3044\u3066\u3001\u305d\u306e\u4fdd\u5b58\u7b49\u306b\u4e3b\u773c\u3092\u304a\u3044\u3066\u884c\n\u3046\u3082\u306e\u3067\u3042\u308b\u3002\u3053\u306e\u5834\u5408\u306b\u304a\u3051\u308b\u5efa\u7269\u306e\u9451\u5b9a\u8a55\u4fa1\u984d\u306f\u3001\u4e00\u822c\u306b\u5bfe\u8c61\u4e0d\u52d5\u7523\u3068\u540c\u7b49\u306e\u6709\u7528\n\u6027\u3092\u6301\u3064\u3082\u306e\u306b\u7f6e\u304d\u63db\u3048\u3066\u6c42\u3081\u305f\u539f\u4fa1(\u7f6e\u63db\u539f\u4fa1)\u3092\u518d\u8abf\u9054\u539f\u4fa1\u3068\u3057\u3066\u5f97\u305f\u7a4d\u7b97\u4fa1\u683c\u3092\n\u6a19\u6e96\u3068\u3057\u3066\u6c7a\u5b9a\u3059\u308b\u3082\u306e\u3068\u3059\u308b\u3002\n\u30cb \u501f\u5bb6\u6a29\u306e\u53d6\u5f15\u6163\u884c\u304c\u3042\u308b\u5834\u5408\u306b\u304a\u3051\u308b\u501f\u5bb6\u6a29\u306e\u9451\u5b9a\u8a55\u4fa1\u984d\u306f\u3001\u5f53\u4e8b\u8005\u9593\u306e\u500b\u5225\u7684\u4e8b\u60c5\n\u3092\u8003\u616e\u3057\u3066\u6c42\u3081\u305f\u6bd4\u6e96\u4fa1\u683c\u3092\u6a19\u6e96\u3068\u3057\u3001\u81ea\u7528\u306e\u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u306e\u4fa1\u683c\u304b\u3089\u8cb8\u5bb6\u53ca\u3073\u305d\n\u306e\u6577\u5730\u306e\u4fa1\u683c\u3092\u63a7\u9664\u3057\u3001\u6240\u8981\u306e\u8abf\u6574\u3092\u884c\u3063\u3066\u5f97\u305f\u4fa1\u683c\u3092\u6bd4\u8f03\u8003\u91cf\u3057\u3066\u6c7a\u5b9a\u3059\u308b\u3082\u306e\u3068\u3059\n\u308b\u3002\n\u30db \u501f\u5bb6\u6a29\u306e\u4fa1\u683c\u3068\u3044\u308f\u308c\u3066\u3044\u308b\u3082\u306e\u306b\u306f\u3001\u8cc3\u8cb8\u4eba\u304b\u3089\u5efa\u7269\u306e\u660e\u6e21\u3057\u306e\u8981\u6c42\u3092\u53d7\u3051\u3001\u501f\u5bb6\n\u4eba\u304c\u4e0d\u968f\u610f\u306e\u7acb\u9000\u304d\u306b\u4f34\u3044\u4e8b\u5b9f\u4e0a\u55aa\u5931\u3059\u308b\u3053\u3068\u3068\u306a\u308b\u7d4c\u6e08\u7684\u5229\u76ca\u7b49\u3001\u8cc3\u8cb8\u4eba\u3068\u306e\u95a2\u4fc2\u306b\n\u304a\u3044\u3066\u500b\u5225\u7684\u306a\u5f62\u3092\u3068\u3063\u3066\u5177\u u8a18\u8ff0\u306e\u3046\u3061\u3001\u8aa4\u3063\u3066\u3044\u308b\u3082\u306e\u306f\u3069\u308c\u304b\u3002","choices":["\u7d99\u7d9a\u8cc3\u6599\u56fa\u6709\u306e\u4fa1\u683c\u5f62\u6210\u8981\u56e0\u306f\u3001\u76f4\u8fd1\u5408\u610f\u6642\u70b9\u304b\u3089\u4fa1\u683c\u6642\u70b9\u307e\u3067\u306e\u671f\u9593\u306b\u304a\u3051\u308b\u8981\u56e0\n\u304c\u4e2d\u5fc3\u3068\u306a\u308b\u304c\u3001\u4e3b\u306a\u3082\u306e\u306e\u4f8b\u793a\u3068\u3057\u3066\u571f\u5730\u4fa1\u683c\u306e\u63a8\u79fb\u3001\u516c\u79df\u516c\u8ab2\u306e\u63a8\u79fb\u3001\u5951\u7d04\u306e\u5185\u5bb9\n\u53ca\u3073\u305d\u308c\u306b\u95a2\u3059\u308b\u7d4c\u7def\u306a\u3069\u304c\u6319\u3052\u3089\u308c\u308b\u3002","\u7d99\u7d9a\u4e2d\u306e\u5b85\u5730\u306e\u8cc3\u8cb8\u501f\u7b49\u306e\u5951\u7d04\u306b\u57fa\u3065\u304f\u5b9f\u969b\u652f\u6255\u8cc3\u6599\u3092\u6539\u5b9a\u3059\u308b\u5834\u5408\u306e\u9451\u5b9a\u8a55\u4fa1\u984d\u306f\u3001\n\u5dee\u984d\u914d\u5206\u6cd5\u306b\u3088\u308b\u8cc3\u6599\u3001\u5229\u56de\u308a\u6cd5\u306b\u3088\u308b\u8cc3\u6599\u3001\u30b9\u30e9\u30a4\u30c9\u6cd5\u306b\u3088\u308b\u8cc3\u6599\u53ca\u3073\u6bd4\u6e96\u8cc3\u6599\u3092\u95a2\n\u9023\u3065\u3051\u3066\u6c7a\u5b9a\u3059\u308b\u3002","\u7d99\u7d9a\u4e2d\u306e\u5b85\u5730\u306e\u8cc3\u8cb8\u501f\u7b49\u306e\u5951\u7d04\u306b\u57fa\u3065\u304f\u5b9f\u969b\u652f\u6255\u8cc3\u6599\u3092\u6539\u5b9a\u3059\u308b\u5834\u5408\u306b\u304a\u3044\u3066\u7dcf\u5408\u7684\n\u306b\u52d8\u6848\u3059\u308b\u4e8b\u9805\u3068\u3057\u3066\u3001\u8cc3\u6599\u306b\u5360\u3081\u308b\u7d14\u8cc3\u6599\u306e\u63a8\u79fb\u3001\u76f4\u8fd1\u5408\u610f\u6642\u70b9\u53ca\u3073\u4fa1\u683c\u6642\u70b9\u306b\u304a\u3051\n\u308b\u65b0\u898f\u8cc3\u6599\u3068\u73fe\u884c\u8cc3\u6599\u306e\u4e56\u96e2\u306e\u7a0b\u5ea6\u3001\u8cc3\u6599\u6539\u5b9a\u306e\u7d4c\u7def\u306a\u3069\u304c\u6319\u3052\u3089\u308c\u308b\u3002","\u8cc3\u6599\u306e\u6539\u5b9a\u304c\u5951\u7d04\u671f\u9593\u306e\u6e80\u4e86\u306b\u4f34\u3046\u66f4\u65b0\u3092\u5951\u6a5f\u3068\u3059\u308b\u5834\u5408\u306b\u304a\u3044\u3066\u3001\u66f4\u65b0\u6599\u304c\u652f\u6255\u308f\n\u308c\u308b\u3068\u304d\u306f\u3001\u3053\u306e\u984d\u3092\u7dcf\u5408\u7684\u306b\u52d8\u6848\u3059\u308b\u3002","\u5951\u7d04\u4e0a\u306e\u6761\u4ef6\u53c8\u306f\u4f7f\u7528\u76ee\u7684\u304c\u5909\u66f4\u3055\u308c\u308b\u3053\u3068\u306b\u4f34\u3044\u8cc3\u6599\u3092\u6539\u5b9a\u3059\u308b\u5834\u5408\u306e\u9451\u5b9a\u8a55\u4fa1\u306b\n\u5f53\u305f\u3063\u3066\u7dcf\u5408\u7684\u306b\u52d8\u6848\u3059\u308b\u4e8b\u9805\u3068\u3057\u3066\u3001\u5f53\u8a72\u5730\u57df\u306e\u8cc3\u8cb8\u501f\u7b49\u306e\u5951\u7d04\u6163\u884c\u3001\u8cc3\u8cb8\u501f\u7b49\u306e\u614b\n\u69d8\u3001\u5951\u7d04\u4e0a\u306e\u6761\u4ef6\u53c8\u306f\u4f7f\u7528\u76ee\u7684\u306e\u5909\u66f4\u5185\u5bb9\u306a\u3069\u304c\u6319\u3052\u3089\u308c\u308b\u3002"],"answer":4},{"questionNumber":34,"question":"\u6b21\u306e\u8a18\u8ff0\u306e\u3046\u3061\u3001\u4e0d\u52d5\u7523\u9451\u5b9a\u8a55\u4fa1\u57fa\u6e96\u5404\u8ad6\u7b2c3\u7ae0\u306e\u9069\u7528\u5bfe\u8c61\u3068\u306a\u308b\u9451\u5b9a\u8a55\u4fa1\u3068\n\u3057\u3066\u8aa4\u3063\u3066\u3044\u308b\u3082\u306e\u306f\u3069\u308c\u304b\u3002","choices":["\u73fe\u5728\u3001\u5efa\u7269\u306f\u7ae3\u5de5\u3057\u3066\u3044\u306a\u3044\u304c\u3001\u8a3c\u5238\u5316\u3092\u4e88\u5b9a\u3057\u3001\u304b\u3064\u4e00\u5b9a\u306e\u6761\u4ef6\u3092\u5145\u8db3\u3057\u3066\u3044\u308b\u672a\n\u7ae3\u5de5\u8cc3\u8cb8\u30aa\u30d5\u30a3\u30b9\u30d3\u30eb\u306e\u53d6\u5f97\u3092\u76ee\u7684\u3068\u3057\u305f\u7279\u5b9a\u4fa1\u683c\u3092\u6c42\u3081\u308b\u9451\u5b9a\u8a55\u4fa1","\u8cc7\u7523\u306e\u6d41\u52d5\u5316\u306b\u95a2\u3059\u308b\u6cd5\u5f8b\u306b\u898f\u5b9a\u3059\u308b\u8cc7\u7523\u306e\u6d41\u52d5\u5316\u306b\u4fc2\u308b\u4e0d\u52d5\u7523\u53d6\u5f15\u3067\u3042\u3063\u3066\u3001\u8cc3\u8cb8\n\u30de\u30f3\u30b7\u30e7\u30f3\u306e\u5efa\u7bc9\u3092\u4e88\u5b9a\u3057\u3066\u3044\u308b\u304c\u3001\u73fe\u72b6\u3 u308b\u8af8\u539f\u5247\u306b\u95a2\u9023\u3057\u305f\u6b21\u306e\u30a4\u304b\u3089\u30db\u307e\u3067\u306e\u8a18\u8ff0\u306e\u3046\u3061\u3001\u6b63\u3057\n\u3044\u3082\u306e\u3092\u3059\u3079\u3066\u63b2\u3052\u305f\u7d44\u5408\u305b\u306f\u3069\u308c\u304b\u3002\n\u30a4 \u4ee3\u66ff\u306e\u539f\u5247\u306b\u3088\u308a\u3001\u4e0d\u52d5\u7523\u306e\u4fa1\u683c\u3082\u4ee3\u66ff\u53ef\u80fd\u306a\u4ed6\u306e\u4e0d\u52d5\u7523\u53c8\u306f\u8ca1\u306e\u4fa1\u683c\u3068\u76f8\u4e92\u306b\u95a2\u9023\n\u3057\u3066\u5f62\u6210\u3055\u308c\u308b\u304c\u3001\u73fe\u6cc1\u306b\u3088\u308b\u7ba1\u7406\u3092\u7d99\u7d9a\u3059\u308b\u516c\u5171\u516c\u76ca\u65bd\u8a2d\u306e\u7528\u306b\u4f9b\u3055\u308c\u3066\u3044\u308b\u4e0d\u52d5\u7523\n\u306b\u3064\u3044\u3066\u306f\u3001\u4ee3\u66ff\u6027\u304c\u4e0d\u5341\u5206\u3067\u3042\u308b\u70b9\u306b\u7559\u610f\u3059\u308b\u5fc5\u8981\u304c\u3042\u308b\u3002\n\u30ed \u4e0d\u52d5\u7523\u306f\u4ed6\u306e\u8ca1\u3068\u7570\u306a\u308a\u7528\u9014\u306e\u591a\u69d8\u6027\u3092\u6709\u3059\u308b\u305f\u3081\u3001\u4e00\u3064\u306e\u4e0d\u52d5\u7523\u306b\u5bfe\u3057\u3066\u8907\u6570\u306e\u6700\n\u6709\u52b9\u4f7f\u7528\u3092\u5224\u5b9a\u3059\u308b\u3053\u3068\u304c\u591a\u3044\u3002\n\u30cf \u9069\u5408\u306e\u539f\u5247\u306f\u3001\u5747\u8861\u306e\u539f\u5247\u3068\u3068\u3082\u306b\u4e0d\u52d5\u7523\u306e\u6700\u6709\u52b9\u4f7f\u7528\u306e\u5224\u5b9a\u306b\u304a\u3044\u3066\u91cd\u8981\u3067\u3042\u308a\u3001\n\u4e0d\u52d5\u7523\u306e\u6700\u6709\u52b9\u4f7f\u7528\u3092\u5224\u5b9a\u3059\u308b\u305f\u3081\u306b\u306f\u3001\u5f53\u8a72\u4e0d\u52d5\u7523\u304c\u793e\u4f1a\u7684\u8981\u8acb\u306b\u9069\u5408\u3057\u3066\u3044\u308b\u304b\u3069\n\u3046\u304b\u3092\u5206\u6790\u3059\u308b\u3053\u3068\u304c\u5fc5\u8981\u3067\u3042\u308b\u3002\n\u30cb \u7af6\u4e89\u306e\u539f\u5247\u306f\u3001\u4e0d\u52d5\u7523\u306e\u4fa1\u683c\u306f\u4e0d\u52d5\u7523\u76f8\u4e92\u9593\u53ca\u3073\u4ed6\u306e\u8ca1\u3068\u306e\u9593\u306e\u7af6\u4e89\u306e\u904e\u7a0b\u306b\u304a\u3044\u3066\n\u5f62\u6210\u3055\u308c\u308b\u3068\u3044\u3046\u539f\u5247\u3067\u3042\u308a\u3001\u4ee3\u66ff\u306e\u539f\u5247\u3068\u3082\u95a2\u9023\u3057\u3066\u3044\u308b\u3002\n\u30db \u53ce\u76ca\u9013\u5897\u53ca\u3073\u9013\u6e1b\u306e\u539f\u5247\u306f\u3001\u3042\u308b\u5358\u4f4d\u6295\u8cc7\u984d\u3092\u7d99\u7d9a\u7684\u306b\u5897\u52a0\u3055\u305b\u308b\u3068\u3001\u3053\u308c\u306b\u4f34\u3063\u3066\n\u7dcf\u53ce\u76ca\u306f\u5897\u52a0\u3059\u308b\u4e00\u65b9\u3001\u3042\u308b\u5358\u4f4d\u6295\u8cc7\u984d\u3092\u7d99\u7d9a\u7684\u306b\u6e1b\u5c11\u3055\u305b\u308b\u3068\u3001\u3053\u308c\u306b\u4f34\u3063\u3066\u7dcf\u53ce\u76ca\n\u306f\u6e1b\u5c11\u3059\u308b\u3068\u3044\u3046\u539f\u5247\u3067\u3042\u308b\u3002","choices":["\u30a4\u3068\u30cf","\u30a4\u3068\u30cb","\u30ed\u3068\u30cf","\u30ed\u3068\u30db","\u30cb\u3068\u30db"],"answer":1},{"questionNumber":9,"question":"\u5bfe\u8c61\u4e0d\u52d5\u7523\u306e\u78ba\u5b9a\u306b\u95a2\u3059\u308b\u6b21\u306e\u30a4\u304b\u3089\u30db\u307e\u3067\u306e\u8a18\u8ff0\u306e\u3046\u3061\u3001\u8aa4\u3063\u3066\u3044\u308b\u3082\u306e\u3092\n\u3059\u3079\u3066\u63b2\u3052\u305f\u7d44\u5408\u305b\u306f\u3069\u308c\u304b\u3002\n\u30a4 \u4e0d\u52d5\u7523\u306e\u9451\u5b9a\u8a55\u4fa1\u3092\u884c\u3046\u306b\u5f53\u305f\u3063\u3066\u306f\u3001\u307e\u305a\u3001\u9451\u5b9a\u8a55\u4fa1\u306e\u5bfe\u8c61\u3068\u306a\u308b\u571f\u5730\u53c8\u306f\u5efa\u7269\u7b49\n\u3092\u7269\u7684\u306b\u78ba\u5b9a\u3059\u308b\u3053\u3068\u306e\u307f\u306a\u3089\u305a\u3001\u9451\u5b9a\u8a55\u4fa1\u306e\u5bfe\u8c61\u3068\u306a\u308b\u6240\u6709\u6a29\u53ca\u3073\u6240\u6709\u6a29\u4ee5\u5916\u306e\u6a29\u5229\n\u3092\u78ba\u5b9a\u3059\u308b\u5fc5\u8981\u304c\u3042\u308b\u3002\n\u30ed \u5bfe\u8c61\u4e0d\u52d5\u7523\u306e\u78ba\u5b9a\u306f\u3001\u9451\u5b9a\u8a55\u4fa1\u306e\u5bfe\u8c61\u3092\u660e\u78ba\u306b\u4ed6\u306e\u4e0d\u52d5\u7523\u3068\u533a\u5225\u3057\u3001\u7279\u5b9a\u3059\u308b\u3053\u3068\u3067\n\u3042\u308a\u3001\u305d\u308c\u306f\u4e0d\u52d5\u7523\u9451\u5b9a\u58eb\u304c\u9451\u5b9a\u8a55\u4fa1\u306e\u4f9d\u983c\u76ee\u7684\u53ca\u3073\u6761\u4ef6\u306b\u7167\u5fdc\u3059\u308b\u5bfe\u8c61\u4e0d\u52d5\u7523\u3068\u5f53\u8a72\n\u4e0d\u52d5\u7523\u306e\u5408\u7406\u7684\u306a\u5229\u7528\u65b9\u6cd5\u3068\u3092\u7167\u5408\u3057\u3066\u78ba\u8a8d\u3059\u308b\u3068\u3044\u3046\u5b9f\u8df5\u884c\u70ba\u3092\u7d4c\u3066\u6700\u7d42\u7684\u306b\u78ba\u5b9a\u3055\n\u308c\u308b\u3079\u304d\u3082\u306e\u3067\u3042\u308b\u3002\n\u30cf \u5bfe\u8c61\u78ba\u5b9a\u6761\u4ef6\u306f\u3001\u9451\u5b9a\u8a55\u4fa1\u306e\u5bfe\u8c61\u3068\u3059\u308b\u4e0d\u52d5\u7523\u306e\u6240\u5728\u3001\u7bc4\u56f2\u7b49\u306e\u7269\u7684\u4e8b\u9805\u53ca\u3073\u6240\u6709\u6a29\u3001\n\u8cc3\u501f\u6a29\u7b49\u306e\u5bfe\u8c61\u4e0d\u52d5\u7523\u306e\u6a29\u5229\u306e\u614b\u69d8\u306b\u95a2\u3059\u308b\u4e8b\u9805\u3092\u78ba\u5b9a\u3059\u308b\u305f\u3081\u306b\u5fc5\u8981\u306a\u6761\u4ef6\u3067\u3042\u308b\u3002\n\u30cb \u5efa\u7bc9\u306b\u4fc2\u308b\u5de5\u4e8b\u304c\u5b8c\u4e86\u3057\u3066\u3044\u306a\u3044\u5efa\u7269\u306f\u3001\u672a\u7ae3\u5de5\u5efa\u7269\u7b49\u9451\u5b9a\u8a55\u4fa1\u306e\u5bfe\u8c61\u3068\u306a\u308b\u304c\u3001\u9020\n\u6210\u306b\u95a2\u3059\u308b\u5de5\u4e8b\u304c\u5b8c\u4e86\u3057\u3066\u3044\u306a\u3044\u571f\u5730\u306f\u3001\u5bfe\u8c61\u3068\u306a\u3089\u306a\u3044\u3002\n\u30db \u672a\u7ae3\u5de5\u5efa\u7269\u7b49\u9451\u5b9a\u8a55\u4fa1\u3092\u884c\u3046\u5834\u5408\u306b\u306f\u3001\u4fa1\u683c\u6642\u70b9\u306b\u304a\u3044\u3066\u60f3\u5b9a\u3055\u308c\u308b\u7ae3\u5de5\u5f8c\u306e\u4e0d\u52d5\u7523\n\u306b\u4fc2\u308b\u7269\u7684\u78ba\u8a8d\u3092\u884c\u3046\u305f\u3081\u306b\u5fc5\u8981\u306a\u8a2d\u8a08\u56f3\u66f8\u7b49\u53ca\u3073\u6a29\u5229\u306e\u614b\u69d8\u306e\u78ba\u8a8d\u3092\u884c\u3046\u305f\u3081\u306e\u8acb\u8ca0\n\u5951\u7d04\u66f8\u7b49\u3092\u53ce\u96c6\u3057\u306a\u3051\u308c\u3070\u306a\u3089\u305a\u3001\u30 7a0b\u5ea6\u7b49\u306b\u3064\u3044\u3066\u8a18\u8f09\u3057\u306a\u3051\u308c\u3070\u306a\u3089\u306a\u3044\u3002","choices":["\u30a4 \u5bfe\u8c61\u4e0d\u52d5\u7523\u306e\u7a2e\u5225\u53ca\u3073\u985e\u578b \u30ed \u8fd1\u96a3\u5730\u57df \u30cf \u5e02\u5834 \u30cb \u4ee3\u66ff\u3001\u7af6\u4e89\u7b49\u306e\u95a2\u4fc2","\u30a4 \u5bfe\u8c61\u4e0d\u52d5\u7523\u306e\u7a2e\u5225\u53ca\u3073\u985e\u578b \u30ed \u985e\u4f3c\u5730\u57df \u30cf \u5e02\u5834 \u30cb \u4f9d\u5b58\u3001\u88dc\u5b8c\u7b49\u306e\u95a2\u4fc2","\u30a4 \u5bfe\u8c61\u4e0d\u52d5\u7523\u53ca\u3073\u4fa1\u683c\u306e\u7a2e\u985e \u30ed \u985e\u4f3c\u5730\u57df \u30cf \u5e02\u5834 \u30cb \u4ee3\u66ff\u3001\u7af6\u4e89\u7b49\u306e\u95a2\u4fc2","\u30a4 \u5bfe\u8c61\u4e0d\u52d5\u7523\u53ca\u3073\u4fa1\u683c\u306e\u7a2e\u985e \u30ed \u8fd1\u96a3\u5730\u57df \u30cf \u4fa1\u683c\u5f62\u6210\u8981\u56e0 \u30cb \u4f9d\u5b58\u3001\u88dc\u5b8c\u7b49\u306e\u95a2\u4fc2","\u30a4 \u5bfe\u8c61\u4e0d\u52d5\u7523\u306e\u7a2e\u5225\u53ca\u3073\u985e\u578b \u30ed \u8fd1\u96a3\u5730\u57df \u30cf \u4fa1\u683c\u5f62\u6210\u8981\u56e0 \u30cb \u4ee3\u66ff\u3001\u7af6\u4e89\u7b49\u306e\u95a2\u4fc2"],"answer":4},{"questionNumber":25,"question":"\u9451\u5b9a\u8a55\u4fa1\u984d\u306e\u6c7a\u5b9a\u306b\u95a2\u3059\u308b\u6b21\u306e\u8a18\u8ff0\u306e\u3046\u3061\u3001\u8aa4\u3063\u3066\u3044\u308b\u3082\u306e\u306f\u3069\u308c\u304b\u3002","choices":["\u66f4\u5730\u306e\u9451\u5b9a\u8a55\u4fa1\u984d\u306f\u3001\u66f4\u5730\u4e26\u3073\u306b\u914d\u5206\u6cd5\u304c\u9069\u7528\u3067\u304d\u308b\u5834\u5408\u306b\u304a\u3051\u308b\u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u306e\n\u53d6\u5f15\u4e8b\u4f8b\u306b\u57fa\u3065\u304f\u6bd4\u6e96\u4fa1\u683c\u4e26\u3073\u306b\u571f\u5730\u6b8b\u4f59\u6cd5\u306b\u3088\u308b\u53ce\u76ca\u4fa1\u683c\u3092\u95a2\u9023\u3065\u3051\u3066\u6c7a\u5b9a\u3059\u308b\u3082\u306e\n\u3068\u3059\u308b\u3002\u518d\u8abf\u9054\u539f\u4fa1\u304c\u628a\u63e1\u3067\u304d\u308b\u5834\u5408\u306b\u306f\u3001\u7a4d\u7b97\u4fa1\u683c\u3092\u3082\u95a2\u9023\u3065\u3051\u3066\u6c7a\u5b9a\u3059\u3079\u304d\u3067\u3042\u308b\u3002\n\u66f4\u5730\u306e\u9762\u7a4d\u7b49\u306b\u3088\u3063\u3066\u306f\u958b\u767a\u6cd5\u306b\u3088\u308b\u4fa1\u683c\u3092\u6bd4\u8f03\u8003\u91cf\u3057\u3066\u6c7a\u5b9a\u3059\u308b\u3082\u306e\u3068\u3059\u308b\u3002","\u5efa\u4ed8\u5730\u306e\u9451\u5b9a\u8a55\u4fa1\u984d\u306f\u3001\u66f4\u5730\u306e\u4fa1\u683c\u3092\u3082\u3068\u306b\u5f53\u8a72\u5efa\u4ed8\u5730\u306e\u66f4\u5730\u3068\u3057\u3066\u306e\u6700\u6709\u52b9\u4f7f\u7528\u3068\u306e\n\u683c\u5dee\u3001\u66f4\u5730\u5316\u306e\u96e3\u6613\u306e\u7a0b\u5ea6\u7b49\u6577\u5730\u3068\u5efa\u7269\u7b49\u3068\u306e\u95a2\u9023\u6027\u3092\u8003\u616e\u3057\u3066\u6c42\u3081\u305f\u4fa1\u683c\u3092\u6a19\u6e96\u3068\u3057\u3001\n\u914d\u5206\u6cd5\u306b\u57fa\u3065\u304f\u6bd4\u6e96\u4fa1\u683c\u53ca\u3073\u571f\u5730\u6b8b\u4f59\u6cd5\u306b\u3088\u308b\u53ce\u76ca\u4fa1\u683c\u3092\u6bd4\u8f03\u8003\u91cf\u3057\u3066\u6c7a\u5b9a\u3059\u308b\u3082\u306e\u3068\n\u3059\u308b\u3002","\u501f\u5730\u6a29\u306e\u53d6\u5f15\u6163\u884c\u306e\u6210\u719f\u306e\u7a0b\u5ea6\u306e\u9ad8\u3044\u5730\u57df\u306b\u304a\u3051\u308b\u501f\u5730\u6a29\u306e\u9451\u5b9a\u8a55\u4fa1\u984d\u306f\u3001\u501f\u5730\u6a29\u53ca\u3073\n\u501f\u5730\u6a29\u3092\u542b\u3080\u8907\u5408\u4e0d\u52d5\u7523\u306e\u53d6\u5f15\u4e8b\u4f8b\u306b\u57fa\u3065\u304f\u6bd4\u6e96\u4fa1\u683c\u4e26\u3073\u306b\u571f\u5730\u6b8b\u4f59\u6cd5\u306b\u3088\u308b\u53ce\u76ca\u4fa1\u683c\n\u3092\u95a2\u9023\u3065\u3051\u3066\u5f97\u305f\u4fa1\u683c\u3092\u6a19\u6e96\u3068\u3057\u3001\u5f53\u8a72\u501f\u5730\u6a29\u306e\u8a2d\u5b9a\u5951\u7d04\u306b\u57fa\u3065\u304f\u8cc3\u6599\u5dee\u984d\u306e\u3046\u3061\u53d6\u5f15\u306e\n\u5bfe\u8c61\u3068\u306a\u3063\u3066\u3044\u308b\u90e8\u5206\u3092\u9084\u5143\u3057\u3066\u5f97\u305f\u4fa1\u683c\u53ca\u3073\u501f\u5730\u6a29\u53d6\u5f15\u304c\u6163\u884c\u3068\u3057\u3066\u6210\u719f\u3057\u3066\u3044\u308b\u5834\n\u5408\u306b\u304a\u3051\u308b\u5f53\u8a72\u5730\u57df\u306e\u501f\u5730\u6a29\u5272\u5408\u306b\u3088\u308a\u6c42\u3081\u305f\u4fa1\u683c\u3092\u6bd4\u8f03\u8003\u91cf\u3057\u3066\u6c7a\u5b9a\u3059\u308b\u3082\u306e\u3068\u3059\u308b\u3002","\u5e95\u5730\u306e\u9451\u5b9a\u8a55\u4fa1\u984d\u306f\u3001\u5b9f\u969b\u652f\u6255\u8cc3\u6599\u306b\u57fa\u3065\u304f\u7d14\u53ce\u76ca\u7b49\u306e\u73fe\u5728\u4fa1\u5024\u306e\u7dcf\u548c\u3092\u6c42\u3081\u308b\u3053\u3068\u306b\n\u3088\u308a\u5f97\u305f\u53ce\u76ca\u4fa1\u683c\u53ca\u3073\u6bd4\u6e96\u4fa1\u683c\u3092\u95a2\u9023\u3065\u3051\u3066\u6c7a\u5b9a\u3059\u308b\u3082\u306e\u3068\u3059\u308b\u3002","\u533a\u5206\u5730\u4e0a\u6a29\u306e\u9451\u5b9a\u8a55\u4fa1\u984d\u306f\u3001\u8a2d\u5b9a\u4e8b\u4f8b\u7b49\u306b\u57fa\u3065\u304f\u6bd4\u6e96\u4fa1\u683c\u3001\u571f\u5730\u6b8b\u4f59\u6cd5\u306b\u6e96\u3058\u3066\u6c42\u3081\u305f\n\u53ce\u76ca\u4fa1\u683c\u53ca\u3073\u533a\u5206\u5730\u4e0a\u6a29\u306e\u7acb\u4f53\u5229\u7528\u7387\u306b\u3088\u308a\u6c42\u3081\u305f\u4fa1\u683c\u3092\u95a2\u9023\u3065\u3051\u3066\u5f97\u305f\u4fa1\u683c\u3092\u6a19\u6e96\u3068\n\u3057\u3001\u533a\u5206\u5730\u4e0a\u6a29\u306e\u8a2d\u5b9a\u4e8b\u4f8b\u7b49\u306b\u57fa\u3065\u304f\u533a\u5206\u5730\u4e0a\u6a29\u5272\u5408\u306b\u3088\u308a\u6c42\u3081\u305f\u4fa1\u683c\u3092\u6bd4\u8f03\u8003\u91cf\u3057\u3066\u6c7a\n\u5b9a\u3059\u308b\u3082\u306e\u3068\u3059\u308b\u3002"],"answer":2},{"questionNumber":26,"question":"\u81ea\u7528\u306e\u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u306e\u9451\u5b9a\u8a55\u4fa1\u306b\u95a2\u3059\u308b\u6b21\u306e\u30a4\u304b\u3089\u30db\u307e\u3067\u306e\u8a18\u8ff0\u306e\u3046\u3061\u3001\n\u8aa4\u3063\u3066\u3044\u308b\u3082\u306e\u3092\u3059\u3079\u3066\u63b2\u3052\u305f\u7d44\u5408\u305b\u306f\u3069\u308c\u304b\u3002\n\u30a4 \u81ea\u7528\u306e\u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u306e\u5834\u5408\u3001\u81ea\u3089\u304c\u4f7f\u7528\u3059\u308b\u305f\u3081\u306b\u5efa\u7269\u3092\u5efa\u7bc9\u3059\u308b\u306e\u3067\u3001\u767a\u6ce8\u8005\n\u5229\u76ca\u3092\u8003\u616e\u3059\u308b\u5fc5\u8981\u304c\u306a\u304f\u3001\u518d\u8abf\u9054\u539f\u4fa1\u3092\u69cb\u6210\u3059\u308b\u300c\u767a\u6ce8\u8005\u304c\u76f4\u63a5\u8ca0\u62c5\u3059\u3079\u304d\u4ed8\u5e2f\u8cbb\u7528\u300d\n\u306b\u306f\u767a\u6ce8\u8005\u5229\u76ca\u306f\u542b\u307e\u308c\u306a\u3044\u3002\n\u30ed \u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u4e00\u4f53\u3067\u53d6\u5f15\u4e8b\u4f8b\u6bd4\u8f03\u6cd5\u3092\u9069\u7528\u3059\u308b\u5834\u5408\u306b\u9078\u629e\u3059\u308b\u53d6\u5f15\u4e8b\u4f8b\u306f\u3001\u571f\u5730\u3001\n\u5efa\u7269\u3001\u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u306b\u95a2\u3059\u308b\u4fa1\u683c\u5f62\u6210\u8981\u56e0\u306e\u6bd4\u8f03\u304c\u53ef\u80fd\u306a\u3082\u306e\u3067\u3042\u308b\u3053\u3068\u304c\u5fc5\u8981\u3067\n\u3042\u308b\u3002\n\u30cf \u53ce\u76ca\u9084\u5143\u6cd5\u306f\u3001\u4e00\u822c\u7684\u306b\u5e02\u5834\u6027\u3092\u6709\u3057\u306a\u3044\u4e0d\u52d5\u7523\u4ee5\u5916\u306e\u3082\u306e\u306b\u306f\u57fa\u672c\u7684\u306b\u3059\u3079\u3066\u9069\u7528\n\u3059\u3079\u304d\u3082\u306e\u3067\u3042\u308a\u3001\u81ea\u7528\u306e\u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u3067\u3042\u3063\u3066\u3082\u8cc3\u8cb8\u3092\u60f3\u5b9a\u3059\u308b\u3053\u3068\u306b\u3088\u308a\u9069\u7528\n\u3055\u308c\u308b\u3082\u306e\u3067\u3042\u308b\u3002\n\u30cb \u5efa\u7269\u3092\u53d6\u308a\u58ca\u3059\u3053\u3068\u304c\u6700\u6709\u52b9\u4f7f\u7528\u3068\u5224\u65ad\u3055\u308c\u308b\u81ea\u7528\u306e\u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u306e\u9451\u5b9a\u8a55\u4fa1\u984d\n\u306f\u3001\u66f4\u5730\u3068\u3057\u3066\u306e\u4fa1\u683c\u3092\u4e0b\u56de\u308b\u5834\u5408\u3082\u3042\u308b\u3002\n\u30db \u5efa\u7269\u3092\u53d6\u308a\u58ca\u3059\u3053\u3068\u304c\u6700\u6709\u52b9\u4f7f\u7528\u3068\u5224\u65ad\u3055\u308c\u308b\u81ea\u7528\u306e\u5efa\u7269\u53ca\u3073\u305d\u306e\u6577\u5730\u }
function startToday(){
 let all=[];Object.keys(QUESTIONS).forEach(y=>Object.keys(QUESTIONS[y]).forEach(s=>QUESTIONS[y][s].forEach(q=>all.push({y:y,s:s,q:q}))));
 all.sort(()=>Math.random()-.5);let p=all.slice(0,10);if(!p.length){alert("問題データがありません");return;}
 year=p[0].y;subject=p[0].s;list=p.map(x=>x.q);startQuiz(0);
}
function startQuiz(i){
 idx=i;selected=null;answered=false;const q=list[i];el("quizSubject").textContent=year+"・"+subject;el("quizNo").textContent=(i+1)+" / "+list.length;el("qtext").textContent=String(q.question||"").replace(/\\n/g,"\n");
 el("questionImage").innerHTML=q.image?`<img src="${q.image}" alt="問題の図・表" style="display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;border-radius:10px;margin:14px 0">`:"";
 el("choices").innerHTML=q.choices.map((c,n)=>`<button class="choice" data-n="${n}">${n+1}. ${esc(c)}</button>`).join("");
 el("choices").querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>select(Number(b.dataset.n))));
 el("answer").disabled=true;el("answer").classList.remove("hidden");el("quizBackBefore").classList.remove("hidden");el("next").classList.add("hidden");el("toggleMistake").classList.add("hidden");el("quizBack").classList.add("hidden");el("result").className="result hidden";screen("quiz");
}
function select(n){if(answered)return;selected=n;el("answer").disabled=false;el("choices").querySelectorAll(".choice").forEach((b,i)=>b.classList.toggle("selected",i===n));}
function submit(){
 if(selected===null||answered)return;answered=true;const q=list[idx],correct=selected===q.answer,k=year+"|"+subject+"|"+q.questionNumber;
 records[k]={correct:correct,date:new Date().toISOString().slice(0,10),subject:subject};
 if(!correct&&!mistakes.includes(k))mistakes.push(k);if(correct)mistakes=mistakes.filter(x=>x!==k);
 el("choices").querySelectorAll(".choice").forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add("correct");if(i===selected&&!correct)b.classList.add("wrong");});
 el("result").className="result "+(correct?"ok":"ng");el("result").innerHTML=correct?"✅ 正解！":"❌ 不正解。<br>正解は "+(q.answer+1)+" 番です。";
 el("answer").classList.add("hidden");el("quizBackBefore").classList.add("hidden");el("next").classList.remove("hidden");el("toggleMistake").classList.remove("hidden");el("quizBack").classList.remove("hidden");updateMistakeButton();save();
}
function updateMistakeButton(){const q=list[idx],k=year+"|"+subject+"|"+q.questionNumber;el("toggleMistake").textContent=mistakes.includes(k)?"★ 苦手問題から外す":"☆ 苦手問題に登録";}
function toggleMistake(){const q=list[idx],k=year+"|"+subject+"|"+q.questionNumber;if(mistakes.includes(k))mistakes=mistakes.filter(x=>x!==k);else mistakes.push(k);updateMistakeButton();save();}
function showMistakes(){let a=[];mistakes.forEach(k=>{let p=k.split("|"),q=(QUESTIONS[p[0]]?.[p[1]]||[]).find(x=>String(x.questionNumber)===p[2]);if(q)a.push({y:p[0],s:p[1],q:q});});if(!a.length){alert("苦手問題はまだありません");return;}year=a[0].y;subject=a[0].s;list=a.map(x=>x.q);el("listTitle").textContent="🔴 間違えた問題";el("questions").innerHTML=a.map((x,i)=>`<div class="item"><button data-i="${i}">${x.y}・${x.s} 第${x.q.questionNumber}問<br>${esc(x.q.question)}</button></div>`).join("");el("questions").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>startQuiz(Number(b.dataset.i))));screen("list");}
function openStudy(){const box=el("studySubjects");box.innerHTML="";["鑑定理論","行政法規"].forEach(s=>{const wrap=document.createElement("div");wrap.className="card";wrap.innerHTML=`<h3>${s}</h3>`;Object.keys(QUESTIONS).filter(y=>QUESTIONS[y][s]).forEach(y=>{const b=document.createElement("button");b.className="studyYear";b.textContent=`${y}（${QUESTIONS[y][s].length}問）`;b.addEventListener("click",()=>showStudyQuestions(y,s));wrap.appendChild(b)});box.appendChild(wrap)});screen("study")}
function studyCorrectMaterial(q){
  const choices=Array.isArray(q.choices)?q.choices:[];
  const questionText=String(q.question||"").replace(/\\n/g,"\n");
  // 「誤っているもの」を問う問題では、公式正解＝誤った選択肢。
  // 学習モードでは、その正解以外の選択肢だけを「覚えるべき正しい記述」として表示する。
  if(/誤っているもの/.test(questionText)){
    return choices.map((text,i)=>({mark:String(i+1),text})).filter((_,i)=>i!==q.answer);
  }
  // それ以外は、公式正解の選択肢だけを表示する。
  return [{mark:String(q.answer+1),text:choices[q.answer]??""}];
}

function showStudyQuestions(y,s){
  const box=el("studySubjects");
  let cards=`<button class="back" id="studyYearBack">← 年度選択</button><h3>${y}・${s}</h3>`;
  (QUESTIONS[y][s]||[]).forEach(q=>{
    const mats=studyCorrectMaterial(q);
    const questionText=String(q.question||"").replace(/\\n/g,"\n");
    cards+=`<div class="studyCard"><div class="studyQ">第${q.questionNumber}問<br>${esc(questionText)}</div>`;
    if(q.image)cards+=`<img class="studyImg" src="${esc(q.image)}" alt="問題の図表">`;
    const isWrongQuestion=/誤っているもの/.test(questionText);
    cards+=`<div class="studyA">${isWrongQuestion ? "覚えるべき正しい記述" : "正解"}：<br>`;
    cards+=mats.map(x=>`<div style="margin-top:8px">${esc(x.mark)}　${esc(String(x.text).replace(/\\n/g,"\n"))}</div>`).join("");
    cards+=`</div></div>`;
  });
  box.innerHTML=cards;
  el("studyYearBack").addEventListener("click",openStudy);
  screen("study");
}
function stats(){let a=Object.values(records),c=a.filter(x=>x.correct).length;el("sa").textContent=a.length;el("sc").textContent=a.length?Math.round(c/a.length*100)+"%":"0%";el("sd").textContent=new Set(a.map(x=>x.date)).size;el("sm").textContent=mistakes.length;rate("鑑定理論","tp","tr");rate("行政法規","lp","lr");screen("stats");}
function rate(s,b,t){let a=Object.values(records).filter(x=>x.subject===s),c=a.filter(x=>x.correct).length,r=a.length?Math.round(c/a.length*100):0;el(b).style.width=r+"%";el(t).textContent=r+"%";}

el("todayBtn").addEventListener("click",startToday);
el("theoryBtn").addEventListener("click",()=>openSubject("鑑定理論"));
el("lawBtn").addEventListener("click",()=>openSubject("行政法規"));
el("mistakeBtn").addEventListener("click",showMistakes);
el("statsBtn").addEventListener("click",stats);el("studyBtn").addEventListener("click",openStudy);el("studyBack").addEventListener("click",()=>screen("home"));
el("subjectBack").addEventListener("click",()=>screen("home"));
el("listBack").addEventListener("click",()=>openSubject(subject));
el("statsBack").addEventListener("click",()=>screen("home"));
el("quizHome").addEventListener("click",()=>screen("home"));
el("quizBack").addEventListener("click",()=>screen("list"));
el("quizBackBefore").addEventListener("click",()=>screen("list"));
el("answer").addEventListener("click",submit);
el("next").addEventListener("click",()=>idx+1<list.length?startQuiz(idx+1):screen("home"));
el("toggleMistake").addEventListener("click",toggleMistake);
updateHome();
</script>
</body></html>
