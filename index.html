<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<title>不動産鑑定士 短答マスター</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7f6;color:#173b39;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding:0 16px 40px}
header{background:#0f766e;color:white;margin:0 -16px 20px;padding:28px 20px 24px;text-align:center}
header h1{margin:0;font-size:27px;line-height:1.35}
header p{margin:8px 0 0;opacity:.9}
.screen{display:none}
.screen.active{display:block}
.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #0000000d}
.today{text-align:center}
.label{font-size:12px;letter-spacing:2px;color:#0f766e;font-weight:bold}
.progress{height:10px;background:#e5eeee;border-radius:99px;overflow:hidden}
.progress>div{height:100%;width:0;background:#0f766e;transition:.25s}
button{font:inherit;border:0;cursor:pointer}
.primary{width:100%;padding:15px;border-radius:12px;background:#0f766e;color:white;font-weight:bold;margin-top:12px}
.secondary{width:100%;padding:13px;border-radius:12px;background:#e6f1ef;color:#0f766e;font-weight:bold;margin-top:10px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-grid button{background:white;border-radius:14px;padding:20px 10px;min-height:110px;color:#173b39;font-weight:bold;box-shadow:0 2px 8px #0000000a}
.menu-grid span{display:block;font-size:28px;margin-bottom:8px}
.menu-grid small{display:block;margin-top:5px;color:#789}
.back{background:none;color:#0f766e;padding:8px 0;font-weight:bold}
h2{margin:12px 0 16px}
.year-card,.question-item{background:white;border-radius:14px;padding:17px;margin:10px 0;box-shadow:0 2px 8px #0000000a}
.year-card button,.question-item button{width:100%;text-align:left;background:none;color:#173b39}
.subject-button{display:block;width:100%;padding:15px;background:#f4f9f8;border-radius:10px;margin-top:10px;font-weight:bold}
.quiz-header{display:flex;justify-content:space-between;margin:10px 2px 12px;color:#0f766e;font-weight:bold}
.question-text{font-size:18px;line-height:1.8;font-weight:bold;margin-bottom:18px;white-space:pre-wrap}
.choice{display:block;width:100%;text-align:left;background:#f7f9f9;border:2px solid #e5eeee;border-radius:12px;padding:14px;margin:9px 0;line-height:1.6}
.choice.selected{border-color:#0f766e;background:#e6f4f1}
.choice.correct{border-color:#2e8b57;background:#edf8f0}
.choice.wrong{border-color:#c94b4b;background:#fff0f0}
.result{border-radius:12px;padding:15px;margin-top:12px;line-height:1.7}
.result.ok{background:#edf8f0;color:#21643b}
.result.ng{background:#fff0f0;color:#9a2f2f}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:white;border-radius:14px;padding:18px;text-align:center}
.stat strong{display:block;font-size:25px;color:#0f766e}
.stat span{font-size:12px;color:#687}
footer{text-align:center;color:#899;margin-top:25px}
.empty{background:white;border-radius:14px;padding:25px;text-align:center;color:#789}
</style>

<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="短答マスター">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="app">
<header><h1>不動産鑑定士<br>短答マスター</h1><p>鑑定理論・行政法規</p></header>

<main>
<section id="homeScreen" class="screen active">
<div class="card today">
<p class="label">TODAY</p><h2>今日の学習</h2>
<div class="progress"><div id="todayProgress"></div></div>
<p id="todayText">0問回答</p>
<button class="primary" onclick="startToday()">今日の10問</button>
</div>
<div class="menu-grid">
<button onclick="showSubject('鑑定理論')"><span>🏠</span>鑑定理論</button>
<button onclick="showSubject('行政法規')"><span>⚖️</span>行政法規</button>
<button onclick="showMistakes()"><span>🔴</span>間違えた問題<small id="mistakeCount">0問</small></button>
<button onclick="showStats()"><span>📊</span>学習記録</button>
</div>
</section>

<section id="subjectScreen" class="screen">
<button class="back" onclick="goHome()">← ホーム</button>
<h2 id="subjectTitle"></h2><div id="yearList"></div>
</section>

<section id="questionListScreen" class="screen">
<button class="back" onclick="goBackToSubject()">← 戻る</button>
<h2 id="questionListTitle"></h2><div id="questionList"></div>
</section>

<section id="quizScreen" class="screen">
<div class="quiz-header"><span id="quizSubject"></span><span id="quizNumber"></span></div>
<div class="card"><div id="questionText" class="question-text"></div><div id="choices"></div></div>
<button id="answerButton" class="primary" onclick="submitAnswer()" disabled>回答する</button>
<button id="nextButton" class="primary hidden" onclick="nextQuestion()">次の問題</button>
<button id="mistakeButton" class="secondary hidden" onclick="toggleMistake()">☆ 苦手問題に登録</button>
<div id="result" class="result hidden"></div>
</section>

<section id="statsScreen" class="screen">
<button class="back" onclick="goHome()">← ホーム</button><h2>📊 学習記録</h2>
<div class="stats-grid">
<div class="stat"><strong id="totalAnswered">0</strong><span>総回答数</span></div>
<div class="stat"><strong id="totalCorrect">0%</strong><span>正答率</span></div>
<div class="stat"><strong id="totalStudyDays">0</strong><span>学習日数</span></div>
<div class="stat"><strong id="totalMistakes">0</strong><span>苦手問題</span></div>
</div>
<div class="card"><h3>科目別正答率</h3>
<p>鑑定理論</p><div class="progress"><div id="theoryProgress"></div></div><p id="theoryRate">0%</p>
<p>行政法規</p><div class="progress"><div id="lawProgress"></div></div><p id="lawRate">0%</p>
</div>
</section>
</main>
<footer><small>学習記録はこの端末のブラウザに保存されます。</small></footer>
</div>

<script>
const QUESTIONS = {"令和8年": {"行政法規": [{"questionNumber": 1, "question": "行政手続法に関する次の記述のうち、正しいものはどれか。", "choices": ["行政庁は、申請に対する処分を行う場合、必ず理由を示さなければならない。", "行政指導は、法律上の根拠がなければ一切行うことができない。", "不利益処分を行う場合、原則として聴聞または弁明の機会の付与が必要である。", "行政手続法は、すべての行政機関のすべての処分に適用される。"], "answer": 2}, {"questionNumber": 2, "question": "行政不服審査法に関する次の記述のうち、正しいものはどれか。", "choices": ["審査請求は、必ず行政庁の許可を受けて行わなければならない。", "審査請求は、原則として処分があったことを知った日の翌日から起算する。", "審査請求をすることができる期間には法律上の定めがある。", "行政不服審査法では審査請求を認めていない。"], "answer": 2}], "鑑定理論": [{"questionNumber": 1, "question": "不動産鑑定評価に関する次の記述のうち、正しいものはどれか。", "choices": ["不動産の価格は常に一定である。", "不動産鑑定評価では市場参加者の行動を考慮する。", "鑑定評価において地域分析は必要ない。", "収益価格はすべての不動産について必ず適用される。"], "answer": 1}, {"questionNumber": 2, "question": "不動産の価格形成要因に関する次の記述のうち、正しいものはどれか。", "choices": ["一般的要因は価格形成に影響しない。", "地域要因は個別的要因とは無関係である。", "個別的要因には土地の形状などが含まれる。", "価格形成要因は一切変動しない。"], "answer": 2}]}};

let currentSubject="", currentYear="", currentQuestions=[], currentIndex=0;
let selectedAnswer=null, answered=false;

const $=id=>document.getElementById(id);
const key=q=>`${currentYear}|${currentSubject}|${q.questionNumber}`;
let records=JSON.parse(localStorage.getItem("kanteishi_records")||"{}");
let mistakes=JSON.parse(localStorage.getItem("kanteishi_mistakes")||"[]");

function save(){
 localStorage.setItem("kanteishi_records",JSON.stringify(records));
 localStorage.setItem("kanteishi_mistakes",JSON.stringify(mistakes));
 updateHome();
}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");window.scrollTo(0,0)}
function goHome(){show("homeScreen");updateHome()}
function showSubject(subject){
 currentSubject=subject;$("subjectTitle").textContent=subject;
 const years=Object.keys(QUESTIONS).filter(y=>QUESTIONS[y][subject]);
 $("yearList").innerHTML=years.length?years.map(y=>`<div class="year-card"><b>${y}</b><button class="subject-button" onclick="showQuestionList('${esc(y)}','${esc(subject)}')">${QUESTIONS[y][subject].length}問を解く →</button></div>`).join(""):`<div class="empty">問題データがありません。</div>`;
 show("subjectScreen");
}
function showQuestionList(year,subject){
 currentYear=year;currentSubject=subject;currentQuestions=QUESTIONS[year][subject]||[];
 $("questionListTitle").textContent=`${year}・${subject}`;
 $("questionList").innerHTML=currentQuestions.map((q,i)=>`<div class="question-item"><button onclick="startQuiz(${i})">第${q.questionNumber}問　${esc(q.question)}</button></div>`).join("");
 show("questionListScreen");
}
function startToday(){
 let all=[];Object.keys(QUESTIONS).forEach(y=>Object.keys(QUESTIONS[y]).forEach(s=>QUESTIONS[y][s].forEach(q=>all.push({y,s,q})));
 all.sort(()=>Math.random()-.5);let picked=all.slice(0,10);
 if(!picked.length){alert("問題データがありません。");return}
 currentYear=picked[0].y;currentSubject=picked[0].s;currentQuestions=picked.map(x=>x.q);currentIndex=0;
 startQuiz(0);
}
function startQuiz(i){
 currentIndex=i;selectedAnswer=null;answered=false;
 const q=currentQuestions[i];
 $("quizSubject").textContent=`${currentYear}・${currentSubject}`;
 $("quizNumber").textContent=`${i+1} / ${currentQuestions.length}`;
 $("questionText").textContent=q.question;
 $("choices").innerHTML=q.choices.map((c,n)=>`<button class="choice" id="choice${n}" onclick="selectChoice(${n})">${n+1}. ${esc(c)}</button>`).join("");
 $("answerButton").disabled=true;$("answerButton").classList.remove("hidden");
 $("nextButton").classList.add("hidden");$("mistakeButton").classList.add("hidden");
 $("result").className="result hidden";$("result").textContent="";
 show("quizScreen");
}
function selectChoice(n){
 if(answered)return;
 selectedAnswer=n;$("answerButton").disabled=false;
 document.querySelectorAll(".choice").forEach((b,i)=>b.classList.toggle("selected",i===n));
}
function submitAnswer(){
 if(selectedAnswer===null||answered)return;
 answered=true;const q=currentQuestions[currentIndex];const correct=selectedAnswer===q.answer;
 const k=`${currentYear}|${currentSubject}|${q.questionNumber}`;
 records[k]={correct,date:new Date().toISOString().slice(0,10),subject:currentSubject};
 if(!correct&&!mistakes.includes(k))mistakes.push(k);
 if(correct&&mistakes.includes(k))mistakes=mistakes.filter(x=>x!==k);
 document.querySelectorAll(".choice").forEach((b,i)=>{
   b.disabled=true;
   if(i===q.answer)b.classList.add("correct");
   if(i===selectedAnswer&&!correct)b.classList.add("wrong");
 });
 $("result").className="result "+(correct?"ok":"ng");
 $("result").innerHTML=correct?"✅ 正解！":"❌ 不正解。<br>正解は "+(q.answer+1)+" 番です。";
 $("answerButton").classList.add("hidden");$("nextButton").classList.remove("hidden");$("mistakeButton").classList.remove("hidden");
 $("mistakeButton").textContent=mistakes.includes(k)?"★ 苦手問題から外す":"☆ 苦手問題に登録";
 save();
}
function nextQuestion(){
 if(currentIndex+1<currentQuestions.length)startQuiz(currentIndex+1);else goHome();
}
function toggleMistake(){
 const q=currentQuestions[currentIndex],k=`${currentYear}|${currentSubject}|${q.questionNumber}`;
 if(mistakes.includes(k))mistakes=mistakes.filter(x=>x!==k);else mistakes.push(k);
 $("mistakeButton").textContent=mistakes.includes(k)?"★ 苦手問題から外す":"☆ 苦手問題に登録";save();
}
function showMistakes(){
 let arr=[];
 mistakes.forEach(k=>{
  const [y,s,n]=k.split("|");const q=(QUESTIONS[y]?.[s]||[]).find(x=>String(x.questionNumber)===n);
  if(q)arr.push({y,s,q});
 });
 if(!arr.length){alert("苦手問題はまだありません。");return}
 currentYear=arr[0].y;currentSubject=arr[0].s;currentQuestions=arr.map(x=>x.q);
 $("questionListTitle").textContent="🔴 間違えた問題";
 $("questionList").innerHTML=arr.map((x,i)=>`<div class="question-item"><button onclick="startQuiz(${i})">${x.y}・${x.s} 第${x.q.questionNumber}問<br>${esc(x.q.question)}</button></div>`).join("");
 show("questionListScreen");
}
function goBackToSubject(){showSubject(currentSubject)}
function showStats(){
 const vals=Object.values(records),answered=vals.length,correct=vals.filter(x=>x.correct).length;
 $("totalAnswered").textContent=answered;$("totalCorrect").textContent=answered?Math.round(correct/answered*100)+"%":"0%";
 $("totalMistakes").textContent=mistakes.length;
 $("totalStudyDays").textContent=new Set(vals.map(x=>x.date)).size;
 setRate("鑑定理論","theoryProgress","theoryRate");setRate("行政法規","lawProgress","lawRate");
 show("statsScreen");
}
function setRate(subject,bar,text){
 const a=Object.values(records).filter(x=>x.subject===subject),c=a.filter(x=>x.correct).length,r=a.length?Math.round(c/r*100):0;
 $(bar).style.width=r+"%";$(text).textContent=r+"%";
}
function updateHome(){
 const today=new Date().toISOString().slice(0,10),n=Object.values(records).filter(x=>x.date===today).length;
 $("todayText").textContent=n+"問回答";$("todayProgress").style.width=Math.min(n/10*100,100)+"%";$("mistakeCount").textContent=mistakes.length+"問";
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
updateHome();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
